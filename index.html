<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knowfeed">
<meta name="theme-color" content="#000000">
<meta name="description" content="A personal newspaper and learning app that ends: the news you care about, and things worth learning, in editions that finish.">
<title>Knowfeed</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
</head>
<body class="loading" data-tab="edition">
<header class="topbar" id="topbar">
  <button class="wm" id="wordmark" aria-label="Knowfeed">Knowfeed<i></i></button>
  <span class="edition" id="edLabel"></span>
  <span class="sp"></span>
  <button class="listen-pill glass" id="listenAll" aria-label="Listen to this edition"><svg width="20" height="14" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true"><rect x="0" y="5" width="2" height="4" rx="1"/><rect x="4" y="2" width="2" height="10" rx="1"/><rect x="8" y="0" width="2" height="14" rx="1"/><rect x="12" y="3" width="2" height="8" rx="1"/></svg><svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M1 1.5v11a1 1 0 0 0 1.5.9l9-5.5a1 1 0 0 0 0-1.8l-9-5.5A1 1 0 0 0 1 1.5z"/></svg></button>
  <span class="bar" aria-hidden="true"><i id="prog"></i></span>
</header>
<div class="banners">
  <div id="live" hidden></div>
  <div id="justin" hidden></div>
  <div id="offline" class="offline" hidden>You're offline. Showing what's saved on this phone.</div>
</div>

<main class="feed" id="feed" aria-label="Edition">
  <section class="card skeleton" aria-label="Loading"><div class="inner"><div class="skel w40"></div><div class="skel big"></div><div class="skel big w80"></div><div class="skel"></div><div class="skel w60"></div></div></section>
</main>
<main class="page" id="page" hidden></main>

<nav class="tabbar" aria-label="Main">
  <button class="tab on" data-tab="edition" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg><span>Edition</span></button>
  <button class="tab" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span></button>
  <button class="tab" data-chat="1" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chat</span></button>
  <button class="tab" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span>Saved</span></button>
  <button class="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg><span>Profile</span></button>
</nav>

<article class="story" id="story" aria-label="Story"></article>
<div class="shead" id="shead">
  <button class="circ glass" id="sBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="sp"></span>
  <div class="duo glass"><button id="sPlay" aria-label="Listen"><svg viewBox="0 0 12 14" fill="currentColor"><path d="M1 1.5v11a1 1 0 0 0 1.5.9l9-5.5a1 1 0 0 0 0-1.8l-9-5.5A1 1 0 0 0 1 1.5z"/></svg></button><button id="sShare" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg></button></div>
  <button class="circ glass" id="sMore" aria-label="More options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
</div>
<div class="dock glass" id="dock"></div>

<section class="lesson" id="lesson" aria-label="Lesson" aria-hidden="true"></section>

<section class="onb" id="onb" aria-label="Set up Knowfeed">
  <div class="aurora"></div>
  <div class="orb-wrap"><span class="wm big" id="orb">Knowfeed<i></i></span></div>
  <button class="done-btn" id="doneBtn">Done</button>
  <div class="stream" id="stream" aria-live="polite"><div class="stream-inner" id="lines"></div></div>
  <div class="otray" id="otray"></div>
</section>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Options"></div>
<div class="player" id="player" role="region" aria-label="Audio player"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="now"></span><button class="pp">Pause</button><button class="skip">Next</button><button class="stop" aria-label="Stop">✕</button></div>
<div class="suggest" id="suggest" role="status"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
