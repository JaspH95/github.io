<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knowfeed">
<meta name="theme-color" content="#0E0C1A">
<meta name="description" content="Swipe to learn: live news, knowledge and languages instead of mindless scrolling.">
<title>Knowfeed</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header class="top" id="top">
  <span class="wm" aria-label="Knowfeed">Knowfeed<i></i></span>
  <span class="bar" aria-hidden="true"><i id="prog"></i></span>
  <span class="pill-count" id="likePill" aria-hidden="true">0 liked</span>
  <button class="chat-btn" id="listenBtn" aria-label="Listen to your feed"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></button>
  <button class="chat-btn" id="chatBtn" aria-label="Change your feed"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
</header>
<main class="feed" id="feed" aria-label="Learning feed"></main>
<article class="article" id="article" aria-label="Article"></article>
<section class="onb" id="onb" aria-label="Set up your feed">
  <div class="aurora"></div>
  <div class="orb-wrap"><span class="wm big" id="orb">Knowfeed<i></i></span></div>
  <button class="done-btn" id="doneBtn">Done</button>
  <div class="stream" id="stream" aria-live="polite"><div class="stream-inner" id="lines"></div></div>
  <div class="otray" id="otray"></div>
</section>
<div class="player" id="player" role="region" aria-label="Audio player"><span class="eq"><i></i><i></i><i></i></span><span class="now"></span><button class="pp">Pause</button><button class="skip-card">Next</button><button class="stop" aria-label="Stop">✕</button></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
