<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowfeed: story page example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000; --panel:#1c1c1e; --panel2:#2c2c2e; --ink:#fff; --ink2:#ebebf0; --muted:#8e8e93; --line:rgba(255,255,255,.1);
  --ent:#8cc3e6; --glass:rgba(58,58,62,.55); --glass-line:rgba(255,255,255,.14);
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif:ui-serif, "New York", "Source Serif 4", Georgia, serif;
  --display:"Bricolage Grotesque", -apple-system, system-ui, sans-serif;
}
/* The app is dark by design, like Particle; light-mode tokens kept equal on purpose */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; background:var(--bg); overflow:hidden; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--ui); -webkit-font-smoothing:antialiased; overflow:hidden; -webkit-tap-highlight-color:transparent; }
button{ font:inherit; color:inherit; }
.ent{ color:var(--ent); }
.glass{ background:var(--glass); backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%); border:.5px solid var(--glass-line); }

/* ---------- Feed ---------- */
.topbar{ position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; pointer-events:none; }
.wm{ font-family:var(--display); font-weight:800; font-size:1.15rem; letter-spacing:-.02em; }
.wm i{ display:inline-block; width:.3em; height:.3em; border-radius:50%; background:#FFD23F; margin-left:.07em; }
.edition{ font-size:.8rem; font-weight:600; color:rgba(255,255,255,.75); }
.topbar .sp{ flex:1; }
.listen-pill{ pointer-events:auto; display:flex; align-items:center; gap:8px; height:34px; padding:0 12px; border-radius:999px; border:0; cursor:pointer; }
.avatar{ pointer-events:auto; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.9rem; background:linear-gradient(135deg,#ffb347,#e2445c); border:0; }
.feed{ height:100%; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none; }
.feed::-webkit-scrollbar{ display:none; }
.card{ position:relative; height:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:0 76px 118px 18px; cursor:pointer; }
.scene{ position:absolute; inset:0; width:100%; height:100%; }
.shade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 34%, rgba(0,0,0,.82) 66%, #000 100%); }
.card .inner{ position:relative; max-width:34rem; }
.meta{ display:flex; align-items:center; gap:6px; font-size:.74rem; font-weight:600; letter-spacing:.04em; color:rgba(235,235,245,.62); margin-bottom:8px; }
.meta svg{ width:12px; height:12px; }
.card h2{ font-size:1.6rem; line-height:1.18; font-weight:700; letter-spacing:-.015em; margin:0 0 10px; }
.card p{ font-size:1rem; line-height:1.42; color:rgba(235,235,245,.72); margin:0 0 6px; }
.readbtn{ margin-top:12px; display:inline-flex; align-items:center; gap:8px; font-size:.92rem; font-weight:600; padding:10px 16px; border-radius:999px; cursor:pointer; }
.rail{ position:absolute; right:12px; bottom:128px; display:flex; flex-direction:column; gap:16px; z-index:2; }
.rb{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; border:0; cursor:pointer; }
.rb svg{ width:22px; height:22px; }
.rb.on{ color:#ff3b6b; } .rb.on svg path{ fill:currentColor; }
.rb.save.on{ color:#FFD23F; }
.tabbar{ position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:6; display:flex; gap:10px; align-items:center; max-width:36rem; margin:0 auto; }
.tabs-pill{ flex:1; display:flex; justify-content:space-around; align-items:center; height:58px; border-radius:999px; padding:0 6px; }
.tab{ width:56px; height:46px; border-radius:999px; border:0; background:none; display:grid; place-items:center; cursor:pointer; color:rgba(255,255,255,.9); }
.tab.on{ background:rgba(255,255,255,.14); }
.tab svg{ width:24px; height:24px; }
.search{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center; border:0; cursor:pointer; }
.end{ background:#000; padding:0 22px 140px; justify-content:center; cursor:default; }
.end h2{ font-family:var(--display); font-size:2rem; letter-spacing:-.03em; }

/* ---------- Story page ---------- */
.story{ position:fixed; inset:0; z-index:10; background:#000; overflow-y:auto; transform:translateX(100%); transition:transform .34s cubic-bezier(.2,.8,.2,1); visibility:hidden; overscroll-behavior:contain; }
.story.open{ transform:none; visibility:visible; }
.hero{ position:relative; height:330px; overflow:hidden; }
.hero .scene{ height:100%; }
.hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.35) 70%, #000 100%); }
.shead{ position:fixed; top:0; left:0; right:0; z-index:12; display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px; pointer-events:none; opacity:0; visibility:hidden; transition:opacity .25s; }
.story.open ~ .shead{ opacity:1; visibility:visible; }
.shead > *{ pointer-events:auto; }
.circ{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; border:0; cursor:pointer; }
.circ svg{ width:22px; height:22px; }
.shead .sp{ flex:1; }
.duo{ display:flex; align-items:center; height:44px; border-radius:999px; }
.duo button{ width:52px; height:44px; border:0; background:none; display:grid; place-items:center; cursor:pointer; }
.duo svg{ width:21px; height:21px; }
.sbody{ position:relative; padding:0 16px 130px; margin-top:-92px; max-width:40rem; margin-left:auto; margin-right:auto; }
.sbody .meta{ margin-bottom:6px; }
.sbody h1{ font-size:1.6rem; line-height:1.2; font-weight:700; letter-spacing:-.015em; margin:0 0 8px; }
.sub{ font-size:1rem; line-height:1.42; color:var(--muted); margin:0 0 14px; }
.stabs{ display:flex; gap:26px; overflow-x:auto; scrollbar-width:none; padding:6px 4px 12px; margin:0 -16px; padding-left:20px; padding-right:20px; }
.stabs::-webkit-scrollbar{ display:none; }
.stab{ flex:none; border:0; background:none; padding:4px 0; font-size:1rem; font-weight:500; color:var(--muted); cursor:pointer; white-space:nowrap; }
.stab.on{ color:#fff; font-weight:600; }
.panel{ background:var(--panel); border-radius:18px; padding:18px 18px 8px; }
.panel ul{ margin:0; padding:0; list-style:none; }
.panel li{ position:relative; padding-left:20px; margin:0 0 14px; font-family:var(--serif); font-size:1.08rem; line-height:1.5; color:var(--ink2); }
.panel li::before{ content:""; position:absolute; left:2px; top:.62em; width:7px; height:7px; border-radius:50%; background:#48484a; }
.panel li b.ent{ font-weight:600; }
.w5{ display:grid; grid-template-columns:70px 1fr; gap:4px 12px; font-family:var(--serif); font-size:1.05rem; line-height:1.5; color:var(--ink2); padding-bottom:12px; }
.w5 dt{ font-family:var(--ui); font-weight:700; color:#fff; font-size:.95rem; padding-top:2px; }
.w5 dd{ margin:0 0 10px; }
.tl{ margin:0; padding:0 0 6px; list-style:none; }
.tl li{ padding-left:22px; }
.tl li::before{ background:var(--ent) !important; }
.tl .when{ display:block; font-family:var(--ui); font-size:.78rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
.sec{ margin-top:30px; }
.sech{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.sech h3{ margin:0; font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:4px; }
.sech h3 svg{ width:16px; height:16px; color:var(--muted); }
.collapse{ width:32px; height:32px; border:0; background:none; cursor:pointer; color:var(--ent); font-size:1.4rem; line-height:1; }
.sec.closed .secbody{ display:none; }
.hscroll{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; margin:0 -16px; padding:0 16px; }
.hscroll::-webkit-scrollbar{ display:none; }
.acard{ flex:none; width:78%; max-width:320px; scroll-snap-align:start; background:var(--panel); border-radius:14px; padding:12px 14px; text-decoration:none; color:inherit; display:block; }
.arow{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.logo{ width:36px; height:36px; flex:none; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.8rem; color:#fff; }
.outlet{ flex:1; min-width:0; font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.age{ font-size:.72rem; font-weight:600; color:var(--muted); letter-spacing:.04em; }
.ahead{ font-size:.98rem; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.qwho{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.qwho .logo{ width:30px; height:30px; font-size:.7rem; }
.qwho b{ display:block; color:var(--ent); font-size:.95rem; font-weight:600; }
.qwho span{ font-size:.8rem; color:var(--muted); }
.qcard{ background:var(--panel); border-radius:16px; padding:16px; }
.qcard blockquote{ margin:0 0 10px; font-family:var(--serif); font-style:italic; font-size:1.1rem; line-height:1.45; color:#fff; }
.qcard p{ margin:0 0 12px; font-size:.84rem; line-height:1.4; color:var(--muted); }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:.8rem; font-weight:600; background:var(--panel2); padding:6px 10px; border-radius:999px; color:var(--ink2); }
.follow-intro{ font-size:.92rem; color:var(--muted); margin:0 0 10px; }
.follow-intro b{ color:#fff; font-weight:600; }
.follow-intro .plus{ color:var(--ent); font-weight:600; }
.erow{ display:flex; align-items:center; gap:12px; padding:9px 0; }
.erow .logo{ width:40px; height:40px; border-radius:12px; }
.erow .tx{ flex:1; min-width:0; }
.erow .tx b{ display:block; font-size:1rem; font-weight:600; color:#fff; }
.erow .tx > span{ font-size:.84rem; color:var(--muted); }
.fbtn{ width:34px; height:34px; border-radius:50%; border:0; background:var(--panel2); color:var(--ent); font-size:1.3rem; line-height:1; cursor:pointer; display:grid; place-items:center; }
.fbtn.on{ background:var(--ent); color:#000; font-size:.95rem; }
.learn{ color:#fff; display:flex; gap:14px; align-items:center; background:linear-gradient(135deg, rgba(108,92,255,.28), rgba(63,203,184,.18)); border:.5px solid rgba(255,255,255,.12); border-radius:16px; padding:16px; cursor:pointer; width:100%; text-align:left; }
.learn .ic{ width:44px; height:44px; flex:none; border-radius:12px; background:rgba(255,255,255,.12); display:grid; place-items:center; }
.learn b{ display:block; font-size:1rem; margin-bottom:2px; }
.learn span{ font-size:.84rem; color:rgba(235,235,245,.7); }
.rcard{ flex:none; position:relative; width:72%; max-width:300px; height:360px; border-radius:18px; overflow:hidden; scroll-snap-align:start; display:flex; flex-direction:column; justify-content:flex-end; padding:16px; cursor:pointer; border:0; text-align:left; color:#fff; background:#111; }
.rcard .shade{ background:linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 75%, rgba(0,0,0,.95) 100%); }
.rcard > *:not(.scene):not(.shade){ position:relative; }
.rcard h4{ margin:0 0 6px; font-size:1.25rem; line-height:1.2; font-weight:700; }
.rcard p{ margin:0; font-size:.88rem; line-height:1.35; color:rgba(235,235,245,.7); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.dock{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); z-index:12; transform:translate(-50%, 140%); transition:transform .3s ease; display:flex; align-items:center; height:48px; border-radius:999px; padding:0 6px; }
.story.open ~ .dock{ transform:translate(-50%,0); }
.dock button{ white-space:nowrap; display:flex; align-items:center; gap:7px; height:40px; padding:0 16px; border:0; background:none; font-size:.92rem; font-weight:600; cursor:pointer; border-radius:999px; }
.dock button.on{ color:var(--ent); }
.dock svg{ width:18px; height:18px; }
.fine{ font-size:.78rem; color:var(--muted); line-height:1.45; margin-top:28px; }
.toast{ position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 64px); transform:translate(-50%,-20px); z-index:30; background:#fff; color:#000; font-size:.9rem; font-weight:600; padding:10px 16px; border-radius:999px; opacity:0; transition:all .25s; pointer-events:none; white-space:nowrap; }
.toast.show{ opacity:1; transform:translate(-50%,0); }
.sheet-bg{ position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .2s; }
.sheet-bg.open{ opacity:1; pointer-events:auto; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:21; background:#1c1c1e; border-radius:20px 20px 0 0; padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px); transform:translateY(105%); transition:transform .28s ease; max-width:40rem; margin:0 auto; }
.sheet.open{ transform:none; }
.sheet .grab{ width:36px; height:5px; border-radius:3px; background:#48484a; margin:0 auto 12px; }
.sheet button{ display:block; width:100%; text-align:left; background:none; border:0; border-top:.5px solid var(--line); padding:15px 4px; font-size:1rem; cursor:pointer; }
.sheet button:first-of-type{ border-top:0; }
.skel{ height:14px; border-radius:7px; background:linear-gradient(90deg,#1c1c1e,#2c2c2e,#1c1c1e); background-size:200% 100%; animation:sk 1.2s infinite; }
@keyframes sk{ to{ background-position:-200% 0; } }
button:focus-visible, a:focus-visible{ outline:2px solid var(--ent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
@media (min-width:700px){ .card{ padding-left:10vw; padding-right:16vw; } .rail{ right:6vw; } }
</style>
</head>
<body>
<header class="topbar">
  <span class="wm">Knowfeed<i></i></span>
  <span class="edition" id="edLabel">Evening edition</span>
  <span class="sp"></span>
  <button class="listen-pill glass" id="listenAll" aria-label="Listen to this edition"><svg width="20" height="14" viewBox="0 0 20 14" fill="currentColor"><rect x="0" y="5" width="2" height="4" rx="1"/><rect x="4" y="2" width="2" height="10" rx="1"/><rect x="8" y="0" width="2" height="14" rx="1"/><rect x="12" y="3" width="2" height="8" rx="1"/></svg><svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor"><path d="M1 1.5v11a1 1 0 0 0 1.5.9l9-5.5a1 1 0 0 0 0-1.8l-9-5.5A1 1 0 0 0 1 1.5z"/></svg></button>
  <button class="avatar" aria-label="Your profile">J</button>
</header>
<main class="feed" id="feed" aria-label="Evening edition"></main>
<nav class="tabbar" aria-label="Main">
  <div class="tabs-pill glass">
    <button class="tab on" aria-label="Edition"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg></button>
    <button class="tab" aria-label="Learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H11v16H4.5C3.7 20 3 19.3 3 18.5z"/><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H13v16h6.5c.8 0 1.5-.7 1.5-1.5z"/></svg></button>
    <button class="tab" aria-label="Languages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 6 6 7.5M11 5c-.5 3-3 6.5-7 8"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg></button>
    <button class="tab" aria-label="Saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
  </div>
  <button class="search glass" aria-label="Search"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
</nav>

<article class="story" id="story" aria-label="Story"></article>
<div class="shead" id="shead">
  <button class="circ glass" id="sBack" aria-label="Back to feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="sp"></span>
  <div class="duo glass"><button id="sPlay" aria-label="Listen"><svg viewBox="0 0 12 14" fill="currentColor"><path d="M1 1.5v11a1 1 0 0 0 1.5.9l9-5.5a1 1 0 0 0 0-1.8l-9-5.5A1 1 0 0 0 1 1.5z"/></svg></button><button id="sShare" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg></button></div>
  <button class="circ glass" id="sMore" aria-label="More options"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
</div>
<div class="dock glass" id="dock">
  <button id="dFollow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Follow story</span></button>
  <button id="dSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span>Save</span></button>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Story options"><div class="grab"></div>
  <button data-a="report">Report a problem with this story</button>
  <button data-a="less">Show fewer stories like this</button>
  <button data-a="sources">About Knowfeed's sources</button>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
function rng(seed){ let s = seed; return ()=> (s = (s*9301+49297)%233280)/233280; }
function stars(r, n, h=800){ let o=''; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*400).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(r()*1.4+.3).toFixed(2)}" fill="#fff" opacity="${(r()*.7+.2).toFixed(2)}"/>`; return o; }
const svg = (inner, defs='') => `<svg class="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${inner}</svg>`;
function scene(kind, seed){
  const r = rng(seed);
  switch(kind){
    case 'network': { let pts=[...Array(16)].map(()=>[r()*400, 60+r()*520]); let lines='', dots='';
      pts.forEach((p,i)=>pts.forEach((q,j)=>{ if(j>i && Math.hypot(p[0]-q[0],p[1]-q[1])<150) lines+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#9D92FF" stroke-opacity=".35"/>`; }));
      pts.forEach(p=>dots+=`<circle cx="${p[0]}" cy="${p[1]}" r="${3+r()*5}" fill="#C9C2FF"/><circle cx="${p[0]}" cy="${p[1]}" r="18" fill="url(#g)" />`);
      return svg(`<rect width="400" height="800" fill="url(#bg)"/>${lines}${dots}`, `<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1FB8"/><stop offset="1" stop-color="#0C0838"/></linearGradient><radialGradient id="g"><stop offset="0" stop-color="#8E7FFF" stop-opacity=".55"/><stop offset="1" stop-color="#8E7FFF" stop-opacity="0"/></radialGradient>`); }
    case 'pipeline': { let bars=''; [120,170,230,300,390].forEach((h,i)=>bars+=`<rect x="${40+i*68}" y="${560-h}" width="46" height="${h}" rx="10" fill="#5FE3D2" opacity="${.35+i*.13}"/>`);

    <div class="rail">
      <button class="rb glass like ${liked.has(s.id)?'on':''}" aria-label="Like">${heart}</button>
      <button class="rb glass save ${saved.has(s.id)?'on':''}" aria-label="Save">${mark}</button>
    </div>`;
  el.querySelector('.like').addEventListener('click', e=>{ e.stopPropagation(); toggle(liked,'ks-liked',s.id); e.currentTarget.classList.toggle('on', liked.has(s.id)); });
  el.querySelector('.save').addEventListener('click', e=>{ e.stopPropagation(); toggle(saved,'ks-saved',s.id); e.currentTarget.classList.toggle('on', saved.has(s.id)); toast(saved.has(s.id)?'Saved':'Removed from Saved'); });
  el.addEventListener('click', ()=>openStory(s));
  feed.appendChild(el);
});
const end = document.createElement('section'); end.className = 'card end';
end.innerHTML = `<div class="inner"><h2>You're up to date.</h2><p>That's this edition. In the full app, learning takes over from here: today's Series episode, a language lesson and a quick review.</p></div>`;
feed.appendChild(end);
function toggle(set, key, id){ set.has(id) ? set.delete(id) : set.add(id); save(key, [...set]); }

/* ---------- Story page ---------- */
const story = $('#story');
let current = null, tab = 'overview';
function panelHTML(s){
  if(tab === 'overview') return `<ul>${s.overview.map(b=>`<li>${hl(b,'b')}</li>`).join('')}</ul>`;
  if(tab === 'fivew') return `<dl class="w5">${s.fivew.map(([k,v])=>`<dt>${k}</dt><dd>${hl(v,'b')}</dd>`).join('')}</dl>`;
  return `<ul class="tl">${s.timeline.map(([w,t])=>`<li><span class="when">${w}</span>${t}</li>`).join('')}</ul>`;
}
function openStory(s){
  current = s; tab = 'overview'; stopSpeech();
  const others = STORIES.filter(x=>x.id!==s.id);
  story.innerHTML = `
    <div class="hero">${scene(s.scene, s.seed)}</div>
    <div class="sbody">
      <div class="meta">${bolt}<span>${s.ago}</span></div>
      <h1>${hl(s.title)}</h1>
      <p class="sub">${hl(s.sub)}</p>
      <div class="stabs" role="tablist">
        <button class="stab on" data-t="overview" role="tab">Overview</button>
        <button class="stab" data-t="fivew" role="tab">The 5 Ws</button>
        <button class="stab" data-t="timeline" role="tab">Timeline</button>
      </div>
      <div class="panel" id="panel">${panelHTML(s)}</div>

      <section class="sec"><div class="sech"><h3>${s.articles.length} Articles ${chev}</h3><button class="collapse" aria-label="Collapse">–</button></div>
        <div class="secbody hscroll">${s.articles.map(([o,ini,col,age,t,u])=>`<a class="acard" href="${u}" target="_blank" rel="noopener"><div class="arow"><span class="logo" style="background:${col}">${ini}</span><span class="outlet">${o}</span><span class="age">${age}</span></div><div class="ahead">${t}</div></a>`).join('')}</div></section>

      ${s.quote ? `<section class="sec"><div class="sech"><h3>Quotes ${chev}</h3><button class="collapse" aria-label="Collapse">–</button></div>
        <div class="secbody"><div class="qwho"><span class="logo" style="background:#10a37f">OA</span><span><b>${s.quote.who}</b><span>${s.quote.role}</span></span></div>
        <div class="qcard"><blockquote>“${s.quote.text}”</blockquote><p>${s.quote.note}</p><span class="chip">${s.quote.src}</span></div></div></section>` : ''}

      <section class="sec"><div class="sech"><h3>People, Places &amp; Things ${chev}</h3></div>
        <p class="follow-intro"><span class="plus">+ Follow</span> <b>People, Places, or Things</b> to get more news you care about</p>
        ${s.entities.map(([n,d,c])=>`<div class="erow"><span class="logo" style="background:${c}">${n.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><span class="tx"><b>${n}</b><span>${d}</span></span><button class="fbtn ${followEnt.has(n)?'on':''}" data-n="${n}" aria-label="Follow ${n}">${followEnt.has(n)?'✓':'+'}</button></div>`).join('')}
      </section>

      <section class="sec"><div class="sech"><h3>Learn the background</h3></div>
        <button class="learn" id="learnBtn"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H11v16H4.5C3.7 20 3 19.3 3 18.5z"/><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H13v16h6.5c.8 0 1.5-.7 1.5-1.5z"/></svg></span><span><b>${s.learn.title}</b><span>New to this? ${s.learn.mins}-minute explainer</span></span></button>
      </section>

      <section class="sec"><div class="sech"><h3>Related Stories</h3></div>
        <div class="hscroll">${others.map(o=>`<button class="rcard" data-id="${o.id}">${scene(o.scene, o.seed)}<div class="shade"></div><div class="meta">${bolt}<span>${o.ago} · ${o.nsrc} SOURCES</span></div><h4>${hl(o.title)}</h4><p>${o.snippet[0]}</p></button>`).join('')}</div>
      </section>

      <p class="fine">Summary written from the ${s.articles.length} articles above. Tap any article to read the original.</p>
    </div>`;
  story.querySelectorAll('.stab').forEach(b=>b.addEventListener('click', ()=>{ tab = b.dataset.t; story.querySelectorAll('.stab').forEach(x=>x.classList.toggle('on', x===b)); $('#panel').innerHTML = panelHTML(s); }));
  story.querySelectorAll('.collapse').forEach(b=>b.addEventListener('click', ()=>{ const sec = b.closest('.sec'); sec.classList.toggle('closed'); b.textContent = sec.classList.contains('closed') ? '+' : '–'; }));
  story.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click', ()=>{ const n = b.dataset.n; toggle(followEnt,'ks-ent',n); const on = followEnt.has(n); b.classList.toggle('on', on); b.textContent = on ? '✓' : '+'; toast(on ? `Following ${n}` : `Unfollowed ${n}`); }));
  story.querySelectorAll('.rcard').forEach(b=>b.addEventListener('click', ()=>openStory(STORIES.find(x=>x.id===b.dataset.id))));
  $('#learnBtn').addEventListener('click', ()=>toast('Opens the explainer card in the full app'));
  syncDock();
  story.scrollTop = 0; requestAnimationFrame(()=>story.classList.add('open'));
}
function closeStory(){ stopSpeech(); story.style.transition=''; story.style.transform=''; story.classList.remove('open'); }
function syncDock(){
  const f = followed.has(current.id), sv = saved.has(current.id);
  $('#dFollow').classList.toggle('on', f); $('#dFollow span').textContent = f ? 'Following' : 'Follow story';
  $('#dSave').classList.toggle('on', sv); $('#dSave span').textContent = sv ? 'Saved' : 'Save';
}
$('#sBack').addEventListener('click', closeStory);
$('#dFollow').addEventListener('click', ()=>{ toggle(followed,'ks-follow',current.id); syncDock(); toast(followed.has(current.id) ? "Following. You'll get updates when this story changes" : 'Stopped following'); });
$('#dSave').addEventListener('click', ()=>{ toggle(saved,'ks-saved',current.id); syncDock(); document.querySelector(`.card[data-id="${current.id}"] .save`)?.classList.toggle('on', saved.has(current.id)); toast(saved.has(current.id)?'Saved':'Removed from Saved'); });
$('#sShare').addEventListener('click', async ()=>{ const text = plain(current.title); try{ if(navigator.share){ await navigator.share({ title:text, text }); } else { await navigator.clipboard.writeText(text); toast('Headline copied'); } }catch(e){} });
const sheet = $('#sheet'), sbg = $('#sheetBg');
$('#sMore').addEventListener('click', ()=>{ sheet.classList.add('open'); sbg.classList.add('open'); });
sbg.addEventListener('click', ()=>{ sheet.classList.remove('open'); sbg.classList.remove('open'); });
sheet.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{ sheet.classList.remove('open'); sbg.classList.remove('open'); toast({report:'Thanks, we\'ll take a look', less:'Got it. Fewer stories like this', sources:'Every summary is written only from the linked articles'}[b.dataset.a]); }));

/* Swipe right or pull down to go back */
let g = null;
story.addEventListener('touchstart', e=>{ const t = e.touches[0]; g = { x:t.clientX, y:t.clientY, top: story.scrollTop <= 0, mode:null }; }, { passive:true });
story.addEventListener('touchmove', e=>{
  if(!g) return; const t = e.touches[0]; const dx = t.clientX - g.x, dy = t.clientY - g.y;
  if(!g.mode){ if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) && dx > 0 && !e.target.closest('.hscroll')) g.mode = 'x'; else if(g.top && dy > 12 && Math.abs(dy) > Math.abs(dx)) g.mode = 'y'; else if(Math.abs(dy) > 12 || Math.abs(dx) > 12) g.mode = 'none'; }
  if(g.mode === 'x'){ g.d = Math.max(0, dx); story.style.transition = 'none'; story.style.transform = `translateX(${g.d}px)`; }
  if(g.mode === 'y'){ g.d = Math.max(0, dy) * .6; story.style.transition = 'none'; story.style.transform = `translateY(${g.d}px) scale(${1 - g.d/2000})`; }
}, { passive:true });
story.addEventListener('touchend', ()=>{ if(g && (g.mode==='x' || g.mode==='y')){ story.style.transition=''; if(g.d > 90) closeStory(); else story.style.transform=''; } g = null; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeStory(); });

/* Listen */
const synth = window.speechSynthesis;
function voice(){ const vs = synth?.getVoices() || []; return vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)); }
function speak(parts){
  if(!synth){ toast("Audio isn't supported on this device"); return; }
  synth.cancel(); const v = voice();
  parts.forEach(p=>{ const u = new SpeechSynthesisUtterance(p); if(v) u.voice = v; u.lang = v?.lang || 'en-GB'; synth.speak(u); });
  toast('Playing');
}
function stopSpeech(){ synth?.cancel(); }
$('#sPlay').addEventListener('click', ()=>{ if(synth?.speaking){ stopSpeech(); toast('Stopped'); return; } speak([plain(current.title), ...current.overview.map(plain)]); });
$('#listenAll').addEventListener('click', ()=>{ if(synth?.speaking){ stopSpeech(); toast('Stopped'); return; } speak(STORIES.flatMap(s=>[plain(s.title), s.snippet.join(' ')])); });

</script>
</body>
</html>
