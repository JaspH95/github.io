/* Listen mode: reads your feed (or an article) aloud */
const synth = window.speechSynthesis;
let voice = null, audioOn = false, audioQueue = [], feedMode = false;
function pickVoice(){ const vs = synth?.getVoices() || []; voice = vs.find(v=>/en-GB/i.test(v.lang) && /natural|premium|enhanced|daniel|serena|kate/i.test(v.name)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
const player = document.getElementById('player');
function speakText(text, onend){
  const u = new SpeechSynthesisUtterance(text); if(voice) u.voice = voice; u.lang = voice?.lang || 'en-GB'; u.rate = 1.02;
  u.onend = onend; u.onerror = () => {}; synth.speak(u);
}
function playQueue(items, mode=false){
  if(!synth){ toast("Audio isn't supported on this device"); return; }
  synth.cancel(); audioQueue = items.slice(); audioOn = true; feedMode = mode; player.classList.add('show'); player.querySelector('.pp').textContent = 'Pause';
  next();
  function next(){ if(!audioOn) return; const it = audioQueue.shift(); if(!it){ if(feedMode) return advanceFeed(); return stopAudio(); } player.querySelector('.now').textContent = it.label; speakText(it.text, next); }
}
function cardSpeech(c){
  if(!c || c.type==='intro' || c.type==='end' || c.type==='langoffer') return null;
  if(c.type==='phrase') return `${c.lang} phrase of the day. ${c.mean}. ${c.when}`;
  if(c.type==='signday') return 'Sign of the day. The B S L vowels. Touch the thumb for A, then the fingertips for E, I, O and U.';
  if(c.type==='live') return c.live==='race' ? 'Race day. Live positions are pinned at the top of your feed.' : `Matchday. ${c.home} are playing, live score at the top of your feed.`;
  if(c.type==='quiz') return `${label(c)}. Quiz. ${c.q} ${c.opts.join(', or ')}? The answer: ${c.opts[c.answer]}. ${c.explain}`;
  if(c.type==='myth') return `${label(c)}. Myth: ${c.myth} Reality: ${c.reality}`;
  if(c.type==='discover') return `Something new: ${plain(c.title.replace('Something new: ',''))}. ${plain(c.body.join(' '))}`;
  return `${label(c)}. ${plain(cardTitle(c))}. ${plain((c.body||[]).join(' '))}`;
}
function advanceFeed(){
  const nx = currentEl?.nextElementSibling;
  if(!nx || !nx._card){ stopAudio(); toast("That's your feed. You're all caught up"); return; }
  feed.scrollTo({ top: nx.offsetTop, behavior:'smooth' }); currentEl = nx;
  const t = cardSpeech(nx._card); if(!t) return advanceFeed();
  setTimeout(()=> playQueue([{ text:t, label: plain(cardTitle(nx._card)) || label(nx._card) }], true), 500);
}
function listenFeed(){
  let el = currentEl && currentEl._card ? currentEl : feed.querySelector('.card:not(.plain)');
  if(el && !el._card) el = el.nextElementSibling;
  if(!el) return;
  if(el !== currentEl){ feed.scrollTo({ top: el.offsetTop, behavior:'smooth' }); currentEl = el; }
  const t = cardSpeech(el._card); if(!t){ currentEl = el; return advanceFeed(); }
  playQueue([{ text:t, label: plain(cardTitle(el._card)) || label(el._card) }], true);
}
function stopAudio(){ audioOn = false; audioQueue = []; synth?.cancel(); player?.classList.remove('show'); }
player.querySelector('.pp').addEventListener('click', e=>{
  if(synth.paused){ synth.resume(); e.currentTarget.textContent = 'Pause'; } else { synth.pause(); e.currentTarget.textContent = 'Play'; }
});
player.querySelector('.stop').addEventListener('click', stopAudio);
player.querySelector('.skip-card')?.addEventListener('click', ()=>{ synth.cancel(); audioQueue = []; if(feedMode) advanceFeed(); else stopAudio(); });
document.getElementById('listenBtn').addEventListener('click', ()=> audioOn ? stopAudio() : listenFeed());

function closeArticle(){ art.style.transition=''; art.style.transform=''; art.classList.remove('open'); }
function nextCard(){
  const id = art.dataset.for; closeArticle();
  const el = feed.querySelector(`[data-id="${id}"]`); const nx = el?.nextElementSibling;
  if(nx) setTimeout(()=> feed.scrollTo({ top: nx.offsetTop, behavior:'smooth' }), 150);
}
/* Pull down at the top, or swipe right, to go back to the feed */
let g = null;
art.addEventListener('touchstart', e=>{ const t = e.touches[0]; g = { x:t.clientX, y:t.clientY, top: art.scrollTop <= 0, mode:null }; }, { passive:true });
art.addEventListener('touchmove', e=>{
  if(!g) return; const t = e.touches[0]; const dx = t.clientX - g.x, dy = t.clientY - g.y;
  if(!g.mode){ if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) && dx > 0) g.mode = 'x'; else if(g.top && dy > 12 && Math.abs(dy) > Math.abs(dx)) g.mode = 'y'; else if(Math.abs(dy) > 12 || Math.abs(dx) > 12) g.mode = 'none'; }
  if(g.mode === 'x'){ g.d = Math.max(0, dx); art.style.transition = 'none'; art.style.transform = `translateX(${g.d}px)`; }
  if(g.mode === 'y'){ g.d = Math.max(0, dy) * .6; art.style.transition = 'none'; art.style.transform = `translateY(${g.d}px) scale(${1 - g.d/2000})`; }
}, { passive:true });
art.addEventListener('touchend', ()=>{
  if(g && (g.mode === 'x' || g.mode === 'y')){ art.style.transition = ''; if(g.d > 90) closeArticle(); else art.style.transform = ''; }
  g = null;
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeArticle(); });

/* ---------- Onboarding and chat (shared screen) ---------- */
const onb = document.getElementById('onb'), lines = document.getElementById('lines'), stream = document.getElementById('stream'), otray = document.getElementById('otray'), orb = document.getElementById('orb');
const wait = ms => new Promise(r=>setTimeout(r, ms));
let fast = false;
stream.addEventListener('click', e => { if(!e.target.closest('button,input')) fast = true; });
const toBottom = () => { stream.scrollTop = stream.scrollHeight; };

/* Keyboard handling: driven by input focus, so it works even where the viewport doesn't report the keyboard */
function setPad(){ lines.style.setProperty('--pad', onb.classList.contains('kb') ? '10px' : Math.round(stream.clientHeight * 0.4) + 'px'); }
function fit(){
  const vv = window.visualViewport;
  if(vv){ onb.style.height = vv.height + 'px'; onb.style.transform = `translateY(${vv.offsetTop}px)`; }
  setPad();
}
if(window.visualViewport){ visualViewport.addEventListener('resize', ()=>{ fit(); keepQuestion(); }); visualViewport.addEventListener('scroll', fit); }
window.addEventListener('resize', ()=>{ if(onb.classList.contains('open')) setPad(); });
/* Put the start of the latest question at the top of the visible area, with the input right under it */
function keepQuestion(){
  const form = lines.querySelector('.oform'); if(!form) return toBottom();
  let q = form.previousElementSibling; while(q && q.classList.contains('ans')) q = q.previousElementSibling;
  const target = q ? q.offsetTop - 30 : form.offsetTop - 120;
  stream.scrollTop = Math.max(0, Math.min(target, form.offsetTop + form.offsetHeight - stream.clientHeight + 16));
}
function kbOn(){ onb.classList.add('kb'); fit(); setTimeout(()=>{ fit(); keepQuestion(); }, 120); setTimeout(()=>{ fit(); keepQuestion(); }, 450); }
function kbOff(){ setTimeout(()=>{ if(!onb.contains(document.activeElement) || document.activeElement.tagName !== 'INPUT'){ onb.classList.remove('kb'); fit(); } }, 120); }

const IC = {
  chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M2 20h20"/></svg>',
  db:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  mega:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10v4h4l6 4V6L7 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  time:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>'
};

function pastAll(){ lines.querySelectorAll('.ln:not(.past)').forEach(n=>n.classList.add('past')); }
function place(node){ const f = lines.querySelector('.oform.chatbox'); f ? lines.insertBefore(node, f) : lines.appendChild(node); }
async function say(text, cls=''){
  const n = document.createElement('p'); n.className = 'ln ' + cls; place(n);
  orb.classList.add('talk'); fast = false;
  for(let i=1; i<=text.length; i++){ if(fast){ n.textContent = text; break; } n.textContent = text.slice(0,i); if(i % 4 === 0) toBottom(); await wait(20); }
  orb.classList.remove('talk'); toBottom(); await wait(fast ? 80 : 380);
  return n;
}
function answer(text){ stream.classList.remove('choosing'); const n = document.createElement('p'); n.className = 'ln ans'; n.textContent = text; place(n); toBottom(); }
function showQ(box){
  const q = box.previousElementSibling; if(!q) return toBottom();
  stream.classList.add('choosing');
  const max = stream.scrollHeight - stream.clientHeight;
  stream.scrollTop = Math.min(max, Math.max(0, q.offsetTop - 64));
}
function makeForm(placeholder, cls){
  const f = document.createElement('form'); f.className = 'oform inline ' + (cls||'');
  f.innerHTML = `<input aria-label="Your answer" placeholder="${placeholder}" autocomplete="off" enterkeyhint="send" maxlength="300"><button class="osend" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>`;
  const input = f.querySelector('input');
  input.addEventListener('focus', kbOn); input.addEventListener('blur', kbOff);
  return f;
}
/* The text box sits directly under the question, so the question can never hide behind the keyboard */
function askText(placeholder){
  return new Promise(res=>{
    const f = makeForm(placeholder); lines.appendChild(f); toBottom();
    const input = f.querySelector('input'); input.maxLength = 40;
    f.addEventListener('submit', e=>{
      e.preventDefault(); const v = input.value.trim(); if(!v) return;
      input.blur(); f.remove(); onb.classList.remove('kb'); fit(); answer(v); res(v);
    });
  });
}
function askOne(opts){
  return new Promise(res=>{
    const box = document.createElement('div'); box.className = 'olist';
    opts.forEach(([k, l, ic], i)=>{ const b = document.createElement('button'); b.className='po'; b.style.animationDelay = `${i*40}ms`; b.innerHTML = `${ic?IC[ic]:''}<span>${l}</span>`;
      b.addEventListener('click', ()=>{ box.remove(); answer(l); res(k); }); box.appendChild(b); });
    lines.appendChild(box); showQ(box);
  });
}
function askMany(opts, btnLabel, noneLabel){
  return new Promise(res=>{
    const picked = new Set(); const box = document.createElement('div'); box.className = 'olist';
    const lab = Object.fromEntries(opts); const finish = keys => { box.remove(); otray.innerHTML = ''; answer(keys.length ? keys.map(k=>lab[k]).join(', ') : noneLabel); res(keys); };
    opts.forEach(([k, l], i)=>{ const b = document.createElement('button'); b.className='po'; b.style.animationDelay = `${i*40}ms`; b.setAttribute('aria-pressed','false'); b.innerHTML = `<span>${l}</span><span class="tick"></span>`;
      b.addEventListener('click', ()=>{ picked.has(k) ? picked.delete(k) : picked.add(k); b.setAttribute('aria-pressed', picked.has(k)); go.disabled = !picked.size && !noneLabel; go.textContent = picked.size ? `${btnLabel} (${picked.size})` : (noneLabel || btnLabel); });
      box.appendChild(b); });
    lines.appendChild(box);
    otray.innerHTML = `<button class="glow-btn">${noneLabel || btnLabel}</button>`;
    const go = otray.querySelector('.glow-btn'); go.disabled = !noneLabel;
    go.addEventListener('click', ()=> finish([...picked]));
    showQ(box);
  });
}

const WORK = [
  ['tech','Tech & data','chip',['ai','future'],'Building the future, and occasionally debugging it.'],
  ['crm','CRM & sales ops','db',['crm','hubspot','ai'],'Keeping the data clean so everyone else can trust it.'],
  ['mkt','Marketing','mega',['crm','psych'],'Half science, half working out what people actually want.'],
  ['fin','Finance','chart',['money','ai'],"A numbers person. I'll keep the charts honest."],
  ['cre','Creative','pen',['psych','future'],'Making things people actually stop and look at.'],
  ['stu','Student','cap',['general','space'],'Learning is already the day job, then.'],
  ['oth','Something else','dots',[],'Fair enough. Your likes will teach me the rest.']
];
const SPORTS = ['Football','Rugby','Cricket','Tennis','Formula 1','Golf','Boxing & MMA','NFL','Basketball','Cycling','Athletics'];
const CLUBS = ['Arsenal','Aston Villa','Chelsea','Everton','Liverpool','Man City','Man United','Newcastle','Spurs','West Ham','Celtic','Rangers'];
function askTeams(){
  return new Promise(res=>{
    const picked = new Set(); const box = document.createElement('div'); box.className = 'olist';
    const addChip = (name, on) => { const b = document.createElement('button'); b.className='po'; b.setAttribute('aria-pressed', on ? 'true':'false'); b.innerHTML = `<span>${name.replace(/[<>&]/g,'')}</span><span class="tick"></span>`;
      if(on) picked.add(name);
      b.addEventListener('click', ()=>{ picked.has(name) ? picked.delete(name) : picked.add(name); b.setAttribute('aria-pressed', picked.has(name)); update(); });
      box.insertBefore(b, form); };
    const form = makeForm('Type another team', ''); form.classList.add('team-add');
    form.addEventListener('submit', e=>{ e.preventDefault(); const i = form.querySelector('input'); const v = i.value.trim().slice(0,30); if(v && !picked.has(v)){ addChip(v, true); update(); } i.value=''; });
    box.appendChild(form);
    CLUBS.forEach(c => addChip(c, false));
    lines.appendChild(box);
    otray.innerHTML = `<button class="glow-btn">No particular team</button>`;
    const go = otray.querySelector('.glow-btn');
    function update(){ go.textContent = picked.size ? `Follow ${picked.size} team${picked.size>1?'s':''}` : 'No particular team'; }
    go.addEventListener('click', ()=>{ document.activeElement?.blur?.(); onb.classList.remove('kb'); fit(); box.remove(); otray.innerHTML=''; answer(picked.size ? [...picked].join(', ') : 'No particular team'); res([...picked]); });
    showQ(box);
  });
}
const UK_CITIES = ['London','Manchester','Birmingham','Glasgow','Edinburgh','Leeds','Bristol','Liverpool','Cardiff','Belfast'];
const WORLD_CITIES = ['New York','Paris','Dublin','Berlin','Dubai','Singapore','Sydney','Toronto'];

function openScreen(mode){
  closeArticle(); lines.innerHTML = ''; otray.innerHTML = '';
  onb.classList.toggle('chat', mode === 'chat');
  onb.classList.remove('fade','kb'); onb.classList.add('open'); fit(); setPad();
}

let running = false;
async function startOnboarding(){
  if(running) return; running = true;
  openScreen('setup');
  await wait(400);
  await say("I'm going to ask you a few quick questions. No need to overthink it. Then I'll build your feed.");
  await say("First, what should I call you?");
  const name = await askText('Your first name');
  pastAll(); await say(`Good to meet you, ${name}.`);
  await say("Which major city should I follow for local news? Pick the one nearest you.");
  let city = await askOne([...UK_CITIES.map(c=>[c, c, 'pin']), ['__world','Outside the UK','globe']]);
  if(city === '__world'){ pastAll(); await say("Which of these is closest?"); city = await askOne(WORLD_CITIES.map(c=>[c, c, 'pin'])); }
  pastAll(); await say(`${city} it is. I'll keep you across the big stories there.`);
  await say("What best describes your work?");
  const wkKey = await askOne(WORK.map(x=>[x[0], x[1], x[2]]));
  const wk = WORK.find(x => x[0] === wkKey);
  pastAll(); await say(wk[4]);
  await say("Which of these would you enjoy learning about? Pick as many as you like.");
  const keys = Object.keys(TOPICS).filter(k => !['local','sport','lang'].includes(k));
  const fun = await askMany(keys.map(k=>[k, TOPICS[k]]), 'Continue');
  pastAll(); await say(fun.length > 3 ? "Good mix. Informative, but never dull." : "Focused. I like it.");
  await say("Do you follow any sports? I'll bring you news on the ones you pick.");
  const sports = await askMany(SPORTS.map(s=>[s, s]), 'Continue', 'Not really');
  let teams = [];
  if(sports.includes('Football')){
    pastAll(); await say("Which football teams? Pick from these or type your own.");
    teams = await askTeams();
  }
  pastAll(); await say(teams.length ? `${teams[0]}. I'll keep you posted, good weeks and bad.` : sports.length ? `Nice. I'll keep you across ${sports.slice(0,2).join(' and ')}${sports.length>2?' and the rest':''}.` : "No problem. Sport stays out of your feed.");
  await say("Want to learn a language while you scroll? You'll get a phrase of the day.");
  const langs = await askMany(LANG_OPTS.map(l=>[l, l]), 'Continue', 'Not right now');
  pastAll(); await say(langs.length ? "A phrase a day adds up faster than you'd think." : "No problem. You can add one later from the chat.");
  await say("Anything you'd rather skip?");
  const avoid = await askMany(keys.filter(k=>!fun.includes(k) && !wk[3].includes(k)).map(k=>[k, TOPICS[k]]), 'Hide these', "Nothing, I'm open");
  pastAll(); await say(avoid.length ? "Done. You won't see those." : "Open-minded. Noted.");
  await say("Roughly how long do you scroll each day? Best guess is fine.");
  const mins = +(await askOne([['5','Under 10 minutes','time'],['15','10 to 20 minutes','time'],['25','20 to 30 minutes','time'],['45','30 minutes or more','time']]));
  pastAll(); await say(`That's around ${Math.round(mins*365/60)} hours a year. Let's make them count.`);
  await say("Building your feed…");
  const bar = document.createElement('div'); bar.className = 'progress'; bar.innerHTML = '<i></i>'; lines.appendChild(bar); toBottom();
  requestAnimationFrame(()=> requestAnimationFrame(()=> bar.firstChild.style.width = '100%'));
  await wait(1900);

  weights = {}; accepted = new Set(); declined = new Set(avoid);
  wk[3].forEach(t => weights[t] = (weights[t]||0) + 1);
  fun.forEach(t => weights[t] = (weights[t]||0) + 2);
  weights.local = (weights.local||0) + 2;
  DISCOVER.forEach(d => { if(weights[d.t]) accepted.add(d.t); });
  profile = { name, place: city, work: wk[1], mins, sports, teams, langs };
  if(langs.some(l=>LANGS[l])) weights.lang = 3; if(langs.includes('British Sign Language')) weights.sign = Math.max(weights.sign||0, 3);
  if(sports.length) weights.sport = 3;
  save('kf-weights', weights); save('kf-accepted',[...accepted]); save('kf-declined',[...declined]); save('kf-profile3', profile);

  const top = Object.entries(weights).filter(([t])=>t!=='local' && t!=='sport').sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>TOPICS[t]);
  pastAll(); await say(`Local news for ${city}${teams.length ? `, ${teams.slice(0,2).join(' and ')} updates` : ''}, plus ${top.join(', ')} and a few surprises along the way.`);
  await say("You can come back any time from the chat button at the top to change things.");
  await say(`Your feed's ready, ${name}.`, 'big');
  otray.innerHTML = '<button class="glow-btn">Show my feed</button>';
  otray.querySelector('.glow-btn').addEventListener('click', closeScreen);
  running = false;
}
async function closeScreen(){
  document.activeElement?.blur?.();
  onb.classList.add('fade'); build(); feed.scrollTo({top:0});
  await wait(500); onb.classList.remove('open', 'fade', 'chat', 'kb'); onb.style.transform = ''; onb.style.height = '';
}
document.getElementById('doneBtn').addEventListener('click', ()=>{ chatOpen = false; running = false; closeScreen(); });

/* ---------- Chat: change your feed and get suggestions (no AI, runs on the device) ---------- */
const RELATED = { ai:['future','psych'], crm:['hubspot','money'], hubspot:['crm','ai'], space:['future','general'], future:['ai','space'], world:['money','general'],
  culture:['general','sign'], general:['space','culture'], psych:['money','general'], money:['crm','world'], sign:['general','culture'], local:['world'], sport:['culture'], lang:['sign'] };
function suggestTopic(){
  const counts = {}; allCards().forEach(c=>{ if(liked.has(c.id)) counts[c.t] = (counts[c.t]||0) + 1; });
  const fav = Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  for(const t of fav) for(const r of (RELATED[t]||[])) if(!(weights[r] >= 2) && TOPICS[r] && !['local','sport','lang'].includes(r)) return { from:t, to:r };
  const fresh = Object.keys(TOPICS).filter(k=>!['local','sport','lang'].includes(k) && !(weights[k] >= 2));
  return fresh.length ? { from:null, to: fresh[Math.floor(Math.random()*fresh.length)] } : null;
}
let chatOpen = false;
async function openChat(){
  if(running) return;
  running = true; chatOpen = true; openScreen('chat');
  await wait(300);
  const n = liked.size;
  await say(`Hi${profile?.name ? ' ' + profile.name : ''}. You've liked ${n} card${n===1?'':'s'}${later.length ? ` and saved ${later.length} for later` : ''}. What would you like to do?`);
  while(chatOpen){
    const pick = await askOne([['sug','Suggest something new','dots'],['topics','Change my topics','chip'],['city','Change my city','pin'],['sport','Sports and teams','time'],['lang','Languages','globe'],['done','Back to my feed','cap']]);
    if(!chatOpen) break;
    pastAll();
    if(pick === 'done'){ break; }
    if(pick === 'sug'){
      const s = suggestTopic();
      if(!s){ await say("You're already following everything. Keep liking cards and I'll keep tuning your feed."); continue; }
      await say(s.from ? `You've liked a lot of ${TOPICS[s.from]}. People who like that often enjoy ${TOPICS[s.to]}. Want to add it?` : `How about ${TOPICS[s.to]}? It's something different from your usual feed.`);
      const yn = await askOne([['y','Yes, add it','chip'],['n','No thanks','dots']]);
      pastAll();
      if(yn === 'y'){ weights[s.to] = Math.max(weights[s.to]||0, 2); declined.delete(s.to); if(DISCOVER.some(d=>d.t===s.to)) accepted.add(s.to); saveAll(); await say(`Added ${TOPICS[s.to]}. You'll see it next time your feed loads.`); }
      else await say("No problem. Anything else?");
      continue;
    }
    if(pick === 'topics'){
      await say("Pick the topics you want in your feed.");
      const keys = Object.keys(TOPICS).filter(k=>!['local','sport','lang'].includes(k));
      const on = await askManyPre(keys.map(k=>[k, TOPICS[k]]), keys.filter(k=>(weights[k]||0) >= 1 && !declined.has(k)), 'Save topics');
      keys.forEach(k=>{ if(on.includes(k)){ weights[k] = Math.max(weights[k]||0, 2); declined.delete(k); if(DISCOVER.some(d=>d.t===k)) accepted.add(k); } else { weights[k] = 0; declined.add(k); accepted.delete(k); } });
      saveAll(); pastAll(); await say(on.length ? `Done. Your feed now covers ${on.length} topic${on.length>1?'s':''}.` : "Done. That's a quiet feed, but it's yours.");
      continue;
    }
    if(pick === 'city'){
      await say("Which major city should I follow for local news?");
      let city = await askOne([...UK_CITIES.map(c=>[c, c, 'pin']), ['__world','Outside the UK','globe']]);
      if(city === '__world'){ pastAll(); await say("Which of these is closest?"); city = await askOne(WORLD_CITIES.map(c=>[c, c, 'pin'])); }
      profile = {...(profile||{}), place:city}; saveAll(); pastAll(); await say(`${city} it is.`);
      continue;
    }
    if(pick === 'sport'){
      await say("Which sports do you follow?");
      const sports = await askManyPre(SPORTS.map(s=>[s, s]), profile?.sports||[], 'Save sports');
      let teams = profile?.teams || [];
      if(sports.includes('Football')){ pastAll(); await say("Which football teams? Pick from these or type your own."); teams = await askTeams(); } else teams = [];
      profile = {...(profile||{}), sports, teams}; weights.sport = sports.length ? 3 : 0; saveAll();
      pastAll(); await say(sports.length ? `Following ${[...teams, ...sports.filter(s=>s!=='Football' || !teams.length)].slice(0,3).join(', ')}${sports.length + teams.length > 3 ? ' and more' : ''}.` : "Sport's out of your feed.");
      continue;
    }
    if(pick === 'lang'){
      await say("Which languages are you learning?");
      const langs = await askManyPre(LANG_OPTS.map(l=>[l, l]), profile?.langs||[], 'Save languages');
      setLangs(langs); pastAll(); await say(langs.length ? `A daily phrase for ${langs.join(', ')}.` : "No languages for now.");
      continue;
    }
  }
  running = false; chatOpen = false; closeScreen();
}
function saveAll(){ save('kf-weights', weights); save('kf-declined',[...declined]); save('kf-accepted',[...accepted]); save('kf-profile3', profile); }
/* Multi-select with current choices already ticked */
function askManyPre(opts, preset, btnLabel){
  return new Promise(res=>{
    const picked = new Set(preset); const box = document.createElement('div'); box.className = 'olist';
    const lab = Object.fromEntries(opts);
    opts.forEach(([k, l], i)=>{ const b = document.createElement('button'); b.className='po'; b.style.animationDelay = `${i*30}ms`; b.setAttribute('aria-pressed', picked.has(k)); b.innerHTML = `<span>${l}</span><span class="tick"></span>`;
      b.addEventListener('click', ()=>{ picked.has(k) ? picked.delete(k) : picked.add(k); b.setAttribute('aria-pressed', picked.has(k)); }); box.appendChild(b); });
    lines.appendChild(box);
    otray.innerHTML = `<button class="glow-btn">${btnLabel}</button>`;
    otray.querySelector('.glow-btn').addEventListener('click', ()=>{ const keys = [...picked]; box.remove(); otray.innerHTML=''; answer(keys.length ? keys.map(k=>lab[k]).join(', ') : 'None'); res(keys); });
    showQ(box);
  });
}
document.getElementById('chatBtn').addEventListener('click', ()=>openChat());

build();
if(!profile) startOnboarding();
</script>
