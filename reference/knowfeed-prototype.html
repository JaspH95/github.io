<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0C1A">
<title>Knowfeed prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --chrome-bg:#F7F6FB; --chrome-ink:#17152B; --sheet-bg:#FFFFFF; --sheet-ink:#17152B; --muted:#5E5A78;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --like:#FF3B6B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chrome-bg:#0E0C1A; --chrome-ink:#F2F0FA; --sheet-bg:#1E1C2C; --sheet-ink:#F2F0FA; --muted:#A9A5C2; }
}
:root[data-theme="dark"]{ --chrome-bg:#0E0C1A; --chrome-ink:#F2F0FA; --sheet-bg:#1E1C2C; --sheet-ink:#F2F0FA; --muted:#A9A5C2; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; background:#0E0C1A; overflow:hidden; overscroll-behavior:none; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:#0E0C1A; color:var(--chrome-ink); font-family:var(--body); -webkit-font-smoothing:antialiased; overflow:hidden; -webkit-tap-highlight-color:transparent; }

/* Topic accents: the pill and the scene tint carry the topic's colour */
.t-ai{ --accent:#6C5CFF; } .t-crm{ --accent:#13A394; } .t-hubspot{ --accent:#FF7A59; }
.t-world{ --accent:#F2B61B; } .t-space{ --accent:#5B7BFF; } .t-future{ --accent:#B8A6FF; }
.t-culture{ --accent:#FF5A36; } .t-psych{ --accent:#E86FD0; } .t-money{ --accent:#3CCB7F; }

.top{ position:fixed; top:0; left:0; right:0; z-index:5; padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px; display:flex; align-items:center; gap:12px; pointer-events:none; color:#fff; }
.top.light{ color:var(--chrome-ink); }
.brand{ font-family:var(--display); font-weight:800; font-size:1.05rem; letter-spacing:-.01em; }
.bar{ flex:1; height:3px; border-radius:3px; background:color-mix(in srgb, currentColor 25%, transparent); overflow:hidden; }
.bar i{ display:block; height:100%; width:0; background:currentColor; transition:width .35s ease; }
.pill-count{ font-size:.8rem; font-weight:600; }

.feed{ height:100%; overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior:contain; scrollbar-width:none; }
.feed::-webkit-scrollbar{ display:none; }
.card{ position:relative; height:100%; scroll-snap-align:start; scroll-snap-stop:always; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; padding:88px 84px 40px 22px; overflow:hidden; background:#0E0C1A; user-select:none; -webkit-user-select:none; }
.card.plain{ background:var(--chrome-bg); color:var(--chrome-ink); }
.scene{ position:absolute; inset:0; width:100%; height:100%; }
.shade{ position:absolute; inset:0; background:linear-gradient(to bottom, rgba(6,5,14,.35) 0%, rgba(6,5,14,0) 22%, rgba(6,5,14,0) 38%, rgba(6,5,14,.78) 70%, rgba(6,5,14,.92) 100%); }
.inner{ position:relative; max-width:34rem; }
.topic{ display:inline-flex; align-items:center; gap:7px; font-size:.85rem; font-weight:600; padding:5px 11px 5px 9px; border-radius:999px; background:rgba(255,255,255,.14); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); margin-bottom:16px; }
.topic::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); }
.tag{ display:inline-block; font-size:.8rem; font-weight:600; margin-left:6px; padding:5px 10px; border-radius:999px; border:1.5px dashed rgba(255,255,255,.6); }
h2{ font-family:var(--display); font-weight:800; font-size:clamp(1.9rem, 8vw, 3rem); line-height:1.03; letter-spacing:-.025em; margin:0 0 14px; text-wrap:balance; }
.big{ font-family:var(--display); font-weight:800; font-size:clamp(4rem, 22vw, 7.5rem); line-height:.88; letter-spacing:-.05em; margin:0 0 12px; }
p{ font-size:1.06rem; line-height:1.45; margin:0 0 9px; color:rgba(255,255,255,.82); max-width:30rem; }
.plain p{ color:var(--muted); }
p strong{ color:#fff; font-weight:600; }
.plain p strong{ color:var(--chrome-ink); }

.actions{ position:absolute; right:12px; bottom:40px; display:flex; flex-direction:column; gap:14px; align-items:center; z-index:2; }
.act{ width:50px; height:50px; border-radius:50%; border:0; background:rgba(255,255,255,.14); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; display:grid; place-items:center; cursor:pointer; }
.act svg{ width:24px; height:24px; }
.act.on svg path{ fill:currentColor; }
.act.like.on{ color:var(--like); }
.act.like.pop{ animation:pop .3s ease; }
@keyframes pop{ 50%{ transform:scale(1.25);} }
.act-label{ font-size:.72rem; font-weight:600; margin-top:-9px; color:rgba(255,255,255,.8); }
button:focus-visible{ outline:3px solid #fff; outline-offset:3px; }

.burst{ position:absolute; width:110px; height:110px; margin:-55px 0 0 -55px; color:var(--like); pointer-events:none; z-index:3; animation:burst .8s ease forwards; }
@keyframes burst{ 0%{ transform:scale(.3); opacity:0;} 25%{ transform:scale(1.1); opacity:1;} 60%{ transform:scale(1); opacity:1;} 100%{ transform:scale(1.2) translateY(-40px); opacity:0;} }

.opts{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
.opt,.choice{ font:600 1rem var(--body); text-align:left; padding:13px 16px; border-radius:14px; border:2px solid rgba(255,255,255,.38); background:rgba(10,8,20,.25); color:#fff; cursor:pointer; }
.opt.right{ background:#fff; color:#15122A; border-color:#fff; }
.opt.wrong{ opacity:.45; text-decoration:line-through; }
.explain{ margin-top:12px; display:none; } .explain.show{ display:block; }
.myth-label{ font-family:var(--display); font-weight:700; font-size:1rem; margin:0 0 6px; color:rgba(255,255,255,.7); }
.reveal,.cta{ font:600 1rem var(--body); margin-top:10px; padding:13px 18px; border-radius:999px; border:0; background:#fff; color:#15122A; cursor:pointer; }
.plain .cta{ background:var(--chrome-ink); color:var(--chrome-bg); }
.reality{ display:none; margin-top:16px; padding-top:14px; border-top:2px solid rgba(255,255,255,.25); } .reality.show{ display:block; }
.choices{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
.choice{ text-align:center; flex:1; min-width:9rem; }
.choice.yes{ background:#fff; color:#15122A; border-color:#fff; }

.hint{ font-size:.95rem; color:var(--muted); display:flex; align-items:center; gap:8px; margin-top:24px; }
.stats{ display:flex; gap:26px; margin:8px 0 10px; }
.stats b{ display:block; font-family:var(--display); font-size:2.8rem; font-weight:800; letter-spacing:-.03em; line-height:1; }
.stats span{ font-size:.9rem; color:var(--muted); }
.why{ font-size:.85rem; color:rgba(255,255,255,.7); margin:-6px 0 12px; }

.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); transform:translate(-50%, 30px); background:#fff; color:#15122A; font-weight:600; font-size:.92rem; padding:11px 16px; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.25); opacity:0; transition:all .25s; z-index:20; white-space:nowrap; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

.scrim{ position:fixed; inset:0; background:rgba(8,6,20,.5); z-index:9; opacity:0; pointer-events:none; transition:opacity .25s; }
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--sheet-bg); color:var(--sheet-ink); border-radius:22px 22px 0 0; padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 22px); max-height:78%; overflow-y:auto; transform:translateY(100%); transition:transform .3s ease; max-width:40rem; margin:0 auto; }
.sheet.open{ transform:translateY(0); }
.grab{ width:40px; height:5px; border-radius:3px; background:var(--muted); opacity:.4; margin:0 auto 16px; }
.sheet h3{ font-family:var(--display); font-weight:800; font-size:1.45rem; letter-spacing:-.02em; margin:0 0 12px; }
.sheet ol{ margin:0; padding:0; list-style:none; counter-reset:d; }
.sheet li{ counter-increment:d; display:grid; grid-template-columns:28px 1fr; gap:6px; padding:12px 0; border-top:1px solid color-mix(in srgb, var(--sheet-ink) 12%, transparent); font-size:1rem; line-height:1.45; }
.sheet li::before{ content:counter(d); font-family:var(--display); font-weight:800; color:var(--muted); }
.close{ font:600 1rem var(--body); width:100%; margin-top:14px; padding:14px; border-radius:14px; border:0; background:color-mix(in srgb, var(--sheet-ink) 8%, transparent); color:var(--sheet-ink); cursor:pointer; }
.close:focus-visible{ outline:3px solid var(--sheet-ink); }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
@media (min-width:700px){ .card{ padding-left:10vw; padding-right:18vw; } .actions{ right:6vw; } }

/* Actions: three buttons */
.act.later.on{ color:#FFD166; }
.cta.ghost{ background:transparent; color:var(--chrome-ink); border:2px solid color-mix(in srgb, var(--chrome-ink) 30%, transparent); }
.stats{ gap:22px; }

/* Full article */
.article{ position:fixed; inset:0; z-index:12; background:var(--chrome-bg); color:var(--chrome-ink); overflow-y:auto; transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1); visibility:hidden; }
.article.open{ transform:none; visibility:visible; }
.a-hero{ position:relative; height:46vh; min-height:280px; color:#fff; display:flex; align-items:flex-end; overflow:hidden; }
.a-head{ position:relative; padding:0 22px 22px; max-width:40rem; }
.a-head h1{ font-family:var(--display); font-weight:800; font-size:clamp(1.8rem, 7.5vw, 2.8rem); line-height:1.04; letter-spacing:-.025em; margin:0 0 10px; text-wrap:balance; }
.a-meta{ font-size:.88rem; color:rgba(255,255,255,.75); }
.a-back{ position:fixed; z-index:5; top:calc(env(safe-area-inset-top,0px) + 12px); left:14px; width:44px; height:44px; border-radius:50%; border:0; background:rgba(10,8,20,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fff; display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.2); }
.a-body{ padding:26px 22px 60px; max-width:38rem; margin:0 auto; }
.a-body p{ color:var(--chrome-ink); font-size:1.1rem; line-height:1.6; margin:0 0 18px; max-width:none; }
.a-body p strong{ color:var(--chrome-ink); }
.a-body .a-lede{ font-size:1.2rem; line-height:1.5; font-weight:500; padding-left:14px; border-left:4px solid var(--accent); }
.a-body h3{ font-family:var(--display); font-weight:700; font-size:1.35rem; letter-spacing:-.015em; margin:30px 0 8px; }
.takeaways{ margin-top:32px; padding:18px 20px; border-radius:18px; background:color-mix(in srgb, var(--accent) 14%, var(--chrome-bg)); }
.takeaways h3{ margin:0 0 8px; font-size:1.1rem; }
.takeaways ul{ margin:0; padding-left:20px; }
.takeaways li{ font-size:1rem; line-height:1.5; margin:6px 0; }
.a-bar{ position:sticky; bottom:0; display:flex; gap:10px; padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 12px); background:color-mix(in srgb, var(--chrome-bg) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid color-mix(in srgb, var(--chrome-ink) 10%, transparent); }
.a-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; font:600 1rem var(--body); padding:13px; border-radius:14px; border:0; background:color-mix(in srgb, var(--chrome-ink) 8%, transparent); color:var(--chrome-ink); cursor:pointer; }
.a-btn svg{ width:20px; height:20px; }
.a-btn.on svg path{ fill:currentColor; }
.a-btn.like.on{ color:var(--like); }
.a-btn.later.on{ color:#C98A00; }
.article button:focus-visible{ outline:3px solid var(--chrome-ink); }


.a-grab{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 8px); left:50%; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:rgba(255,255,255,.55); z-index:2; }
.a-next-unused{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:48px 0 70vh; color:var(--muted); font-size:.95rem; font-weight:600; }
.a-next svg{ animation:bob 1.4s ease-in-out infinite; }
.a-next.ready{ color:var(--chrome-ink); }
@keyframes bob{ 50%{ transform:translateY(5px); } }
.t-sport{ --accent:#22C55E; }
.team-add{ display:flex; gap:8px; margin:4px 0 14px; }

.t-sign{ --accent:#FB923C; }
.unused-why-btn{ font:600 .78rem var(--body); color:rgba(255,255,255,.85); background:none; border:0; padding:5px 4px; margin-left:4px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
.unused-why-line{ font-size:.9rem; color:#fff; background:rgba(10,8,20,.45); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:9px 12px; border-radius:12px; margin:0 0 12px; max-width:26rem; }
.hint-line{ font-size:.9rem; }
.live{ margin-bottom:6px; }
.clock{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.9rem; letter-spacing:.02em; background:#E11D48; padding:5px 11px; border-radius:999px; margin-bottom:14px; }
.clock i{ width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
.score{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; margin:4px 0 12px; }
.score span{ font-family:var(--display); font-weight:700; font-size:1.2rem; line-height:1.15; }
.score span:last-child{ text-align:right; }
.score b{ font-family:var(--display); font-weight:800; font-size:3.2rem; letter-spacing:-.03em; }
.order{ margin:0 0 10px; padding-left:28px; font-family:var(--display); font-weight:700; font-size:1.25rem; line-height:1.5; }
.event{ font-weight:600; color:#fff !important; }
.live-tag{ border-color:#FDA4AF !important; }
.a-tools{ display:flex; gap:8px; flex-wrap:wrap; padding:16px 22px 0; max-width:38rem; margin:0 auto; }
.tool{ font:600 .92rem var(--body); padding:10px 15px; border-radius:999px; border:1.5px solid color-mix(in srgb, var(--chrome-ink) 20%, transparent); background:transparent; color:var(--chrome-ink); cursor:pointer; }
.tool.on{ background:var(--chrome-ink); color:var(--chrome-bg); border-color:var(--chrome-ink); }
.simple-box{ padding:18px 20px; border-radius:18px; background:color-mix(in srgb, var(--accent) 12%, var(--chrome-bg)); margin-bottom:10px; }
.simple-box h3{ margin:0 0 8px !important; }
.simple-box p{ margin:0 !important; }
.src{ margin-top:22px; padding:18px 20px; border-radius:18px; border:1.5px solid color-mix(in srgb, var(--chrome-ink) 12%, transparent); }
.src h3{ margin:0 0 8px !important; font-size:1.1rem !important; }
.src p{ font-size:1rem !important; margin:0 0 8px !important; }
.conf{ display:inline-block; font-size:.85rem; font-weight:600; padding:4px 10px; border-radius:999px; background:color-mix(in srgb, var(--accent) 20%, transparent); }
.src-note{ font-size:.9rem !important; color:var(--muted) !important; }
.lean{ display:flex; height:26px; border-radius:8px; overflow:hidden; margin:6px 0 8px; font-size:.75rem; font-weight:600; }
.lean span{ display:grid; place-items:center; color:#fff; }
.lean .l{ background:#3B82F6; } .lean .c{ background:#8B8FA3; } .lean .r{ background:#EF4444; }
.steps{ margin:8px 0 10px; padding:18px 20px; border-radius:18px; background:color-mix(in srgb, var(--accent) 12%, var(--chrome-bg)); }
.steps h3{ margin:0 0 6px !important; }
.step{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; font-size:1rem; line-height:1.45; cursor:pointer; }
.step input{ width:22px; height:22px; flex:none; margin-top:1px; accent-color:var(--accent); }
.step input:checked + span{ text-decoration:line-through; opacity:.55; }
.steps .cta{ margin-top:8px; background:var(--chrome-ink); color:var(--chrome-bg); }
.wl{ padding-top:calc(env(safe-area-inset-top,0px) + 20px); }
.a-back.static{ position:static; background:color-mix(in srgb, var(--chrome-ink) 10%, transparent); color:var(--chrome-ink); margin-bottom:14px; }
.wl-title{ font-family:var(--display); font-weight:800; font-size:2rem; letter-spacing:-.025em; margin:0 0 6px; }
.wl-item{ padding:16px 0; border-top:1px solid color-mix(in srgb, var(--chrome-ink) 12%, transparent); }
.wl-item h3{ margin:0 0 4px !important; }
.player{ position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:11; display:flex; align-items:center; gap:10px; padding:10px 10px 10px 16px; border-radius:18px; background:rgba(20,18,32,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#fff; transform:translateY(140%); transition:transform .3s ease; max-width:36rem; margin:0 auto; }
.player.show{ transform:none; }
.player .now{ flex:1; min-width:0; font-size:.9rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player button{ font:600 .85rem var(--body); color:#fff; background:rgba(255,255,255,.12); border:0; padding:9px 12px; border-radius:999px; cursor:pointer; }
.eq{ display:flex; gap:3px; align-items:flex-end; height:16px; }
.eq i{ width:3px; background:#FFD23F; border-radius:2px; animation:eq 1s ease-in-out infinite; }
.eq i:nth-child(2){ animation-delay:.2s; } .eq i:nth-child(3){ animation-delay:.4s; }
@keyframes eq{ 0%,100%{ height:4px; } 50%{ height:16px; } }
.top{ gap:9px; }

.t-lang{ --accent:#22D3EE; }
.phrase{ font-size:clamp(2rem, 9vw, 3.2rem) !important; }
.say{ font-size:1.05rem; }
.lang-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
.lang-chips .po{ width:auto; opacity:1; transform:none; animation:none; padding:10px 14px; font-size:.95rem; background:rgba(10,8,20,.45); }
.lang-chips .po .tick{ margin-left:6px; }
.hear-p{ font:inherit; color:inherit; background:none; border:0; padding:0; text-align:left; cursor:pointer; text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:5px; text-decoration-thickness:3px; }
/* Onboarding: dark, glowing, conversational */
.t-local{ --accent:#4FD1C5; } .t-general{ --accent:#F6D365; }
.onb{ position:fixed; left:0; right:0; top:0; height:100%; z-index:15; background:#000; color:#fff; display:none; flex-direction:column; overflow:hidden; overflow:clip; transition:opacity .5s ease; }
.onb.open{ display:flex; }
.onb.fade{ opacity:0; }
.aurora{ position:absolute; left:0; right:0; top:-10%; height:46%; pointer-events:none; background:
  radial-gradient(50% 60% at 50% 30%, rgba(111,93,255,.45), transparent 70%),
  radial-gradient(40% 50% at 30% 40%, rgba(64,200,180,.28), transparent 70%),
  radial-gradient(40% 50% at 72% 42%, rgba(255,140,200,.18), transparent 70%);
  filter:blur(10px); transition:height .3s ease; }
.orb-wrap{ position:relative; flex:none; height:calc(env(safe-area-inset-top,0px) + 200px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding-top:env(safe-area-inset-top,0px); transition:height .3s ease; }
.wm{ font-family:var(--display); font-weight:800; font-size:1.1rem; letter-spacing:-.02em; white-space:nowrap; }
.wm i{ display:inline-block; width:.3em; height:.3em; border-radius:50%; background:#FFD23F; margin-left:.07em; box-shadow:0 0 10px rgba(255,210,63,.6); }
.wm.big{ font-size:2.3rem; letter-spacing:-.035em; color:#fff; text-shadow:0 0 30px rgba(139,123,255,.45); transition:font-size .3s ease; }
.wm.big.talk i{ animation:dotpulse .9s ease-in-out infinite; }
@keyframes dotpulse{ 50%{ transform:scale(1.35); box-shadow:0 0 18px rgba(255,210,63,.9); } }
.onb.kb .orb-wrap{ height:calc(env(safe-area-inset-top,0px) + 64px); }
.onb.kb .wm.big{ font-size:1.4rem; }
.chat-btn{ pointer-events:auto; width:38px; height:38px; flex:none; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer; color:inherit; background:color-mix(in srgb, currentColor 16%, transparent); }
.done-btn{ display:none; position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); right:14px; z-index:2; font:600 .95rem var(--body); color:#fff; background:rgba(255,255,255,.1); border:0; padding:9px 15px; border-radius:999px; cursor:pointer; }
.onb.chat .done-btn{ display:block; }
.ln.thinking{ color:rgba(255,255,255,.45); }
.chips-row{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
.chips-row .po{ width:auto; padding:10px 15px; font-size:.93rem; }
.oform.inline{ margin:4px 0 14px; }
.onb.kb .aurora{ height:24%; }
.stream{ position:relative; flex:1; min-height:0; overflow-x:hidden; overflow-y:auto; padding:10px 22px 16px; scrollbar-width:none; scroll-behavior:smooth;
  --fade:linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.12) 10%, rgba(0,0,0,.55) 28%, #000 44%);

.stream::-webkit-scrollbar{ display:none; }
.stream-inner{ max-width:34rem; margin:0 auto; min-height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:var(--pad, 36vh); transition:padding-bottom .3s ease; }
.ln{ text-align:left; }
.ln{ font-family:var(--body); font-size:1.12rem; line-height:1.45; color:#F5F5F7; margin:0 0 14px; transition:opacity .6s ease, filter .6s ease; max-width:none; }

.po[aria-pressed="true"] .tick::after{ content:""; width:8px; height:4px; border:2px solid #000; border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px); }
@keyframes rise{ to{ opacity:1; transform:none; } }
.progress{ height:4px; border-radius:4px; background:rgba(255,255,255,.1); overflow:hidden; margin:2px 0 16px; }
.progress i{ display:block; height:100%; width:0; background:linear-gradient(90deg, #58D6C8, #8B7BFF, #FFA8DA); transition:width 1.8s ease; }
.otray{ flex:none; padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 14px); max-width:36rem; width:100%; margin:0 auto; }
.otray:empty{ padding:0; }
.glow-btn{ display:block; width:100%; font:600 1.02rem var(--body); color:#fff; padding:15px; border-radius:999px; border:1.5px solid transparent; cursor:pointer;
  background:linear-gradient(#141416,#141416) padding-box, linear-gradient(90deg,#58D6C8,#8B7BFF,#FFA8DA,#FFE08A) border-box;
  box-shadow:0 0 24px rgba(139,123,255,.35), 0 0 60px rgba(88,214,200,.15); animation:rise .35s ease forwards; }
.glow-btn:disabled{ opacity:.35; box-shadow:none; }
.oform{ display:flex; gap:8px; animation:rise .35s ease forwards; }
.oform input{ flex:1; min-width:0; font:16px var(--body); color:#fff; padding:15px 20px; border-radius:999px; background:#1C1C1F; border:1px solid rgba(255,255,255,.1); }
.oform input::placeholder{ color:rgba(255,255,255,.4); }
.oform input:focus{ outline:none; border-color:#9FF0CF; }
.osend{ width:52px; height:52px; flex:none; border-radius:50%; border:0; display:grid; place-items:center; cursor:pointer; color:#000; background:linear-gradient(135deg,#9FF0CF,#8B7BFF); }
.onb button:focus-visible{ outline:2px solid #9FF0CF; outline-offset:3px; }
._unused_skip{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); right:14px; z-index:2; font:500 .9rem var(--body); color:rgba(255,255,255,.5); background:none; border:0; padding:8px; cursor:pointer; }

<script>
/* ---------- Content ---------- */
const TOPICS = { ai:"AI tools & trends", crm:"CRM & automation", hubspot:"HubSpot", world:"Around the world", space:"Space & science", future:"Future tech", culture:"Sport & culture", psych:"Psychology", money:"Money & economics", general:"General knowledge", local:"Local news", sport:"Your sports", sign:"Sign language (BSL)", lang:"Languages" };

const CARDS = [
  { id:"tokens", t:"ai", scene:"network", type:"explain", title:"AI doesn't read words. It reads tokens.",
    body:["A token is a chunk of text, roughly <strong>three-quarters of a word</strong> in English.","Pricing, speed and how much an AI remembers at once are all counted in tokens."],
    article:[["How text gets chopped up","Before a model sees your message, a tokeniser splits it into pieces. Common words are usually one token, while rare words, names and long numbers get split into several. Other languages and code often use more tokens than plain English."],
      ["Why it matters for cost","AI APIs charge per token, for both what you send in and what comes back, and output usually costs more. A prompt that attaches a long document pays for that document on every single call, which is why tools built on AI try to send only the relevant bits."],
      ["The context window","Every model has a limit on how many tokens it can consider at once. Modern models handle very long inputs, but details buried in the middle of a huge prompt can still get less attention, so clear structure and summaries still help."]],
    deeper:["100 tokens is about 75 English words.","Output tokens usually cost more than input tokens.","Shorter, well-structured prompts are cheaper and often more accurate."] },
  { id:"agent", t:"ai", scene:"network", type:"quiz", q:"What does an AI agent do that a basic chatbot doesn't?",
    opts:["Takes actions using tools","Talks in a human voice","Works without the internet"], answer:0,
    explain:"Agents call tools, like searching or updating a CRM record, then decide the next step from the result.",
    article:[["Chatbot versus agent","A chatbot produces text in reply to you. An agent is given tools, such as web search, a CRM connection or an email account, and works in a loop: decide what to do, do it, look at the result, then decide again until the goal is met."],
      ["Where they're showing up","Support triage, research, coding and admin work like updating records are the most common uses today. Many CRMs now include agents that draft replies, qualify leads or answer customer questions from a knowledge base."],
      ["Keeping them safe","The golden rules are least privilege, logging and approval. Give an agent only the access it needs, keep a record of every action, and require a human to approve anything that can't be undone, like emailing customers or deleting data."]],
    deeper:["A chatbot answers; an agent plans, acts, checks and continues.","Permissions are the biggest risk to design around.","Human approval for irreversible actions is the norm in business setups."] },
  { id:"myth", t:"ai", scene:"network", type:"myth", myth:"AI chatbots learn from every conversation you have, in real time.",
    reality:"Most models are frozen after training. Some apps save notes about you as memory, but that's separate from the model itself.",
    article:[["How training really works","A model learns from an enormous dataset in one big training run, which produces a fixed set of internal numbers called weights. Once it's released, those weights don't shift as you chat with it."],
      ["What memory actually is","Some apps save notes from past conversations and quietly add them into future prompts. It feels like the AI is learning about you, but it's closer to a notebook it reads before replying."],
      ["Where your data can matter","Depending on the provider, plan and settings, conversations may be used to train future models. For work data, check the privacy settings and your company's agreement before pasting anything sensitive."]],
    deeper:["Training happens months before a model is released.","Memory is stored text, not a changed model.","Business plans usually have stricter data-use terms than free ones."] },
  { id:"rag", t:"ai", scene:"network", type:"explain", title:"RAG: how AI answers from your own documents",
    body:["Retrieval-augmented generation means the AI <strong>looks things up first</strong>, then answers.","It's how internal help bots answer from company docs instead of guessing."],
    article:[["The steps","Your documents are split into chunks and converted into embeddings, lists of numbers that capture meaning. When someone asks a question, the system finds the chunks closest in meaning and hands them to the model alongside the question."],
      ["Why not just train on the docs?","Retraining a model is slow, expensive and goes out of date the moment a document changes. With RAG, updating the document updates the answers straight away, and the bot can point to exactly where an answer came from."],
      ["What makes it good or bad","The source documents matter most. Duplicated, outdated or contradictory docs produce confident wrong answers. Clear titles, one source of truth per topic and sensible chunk sizes make a big difference."]],
    deeper:["Embeddings let the system search by meaning, not exact words.","Updating a doc updates answers instantly.","Messy source docs are the number one cause of bad answers."] },

  { id:"decay", t:"crm", scene:"pipeline", type:"fact", big:"20–30%", title:"Why CRM data goes stale", body:["How much B2B contact data is <strong>often estimated to go stale each year</strong>.","People change jobs, emails bounce, companies rebrand."],
    article:[["Why data rots","People change jobs and roles, companies merge or rebrand, email domains change and phone numbers get recycled. None of it announces itself in your CRM; records just quietly become wrong."],
      ["What it costs you","Hard bounces damage your email sending reputation, reps waste time on dead contacts, and reports built on bad data lead to bad decisions. Duplicates make it worse by splitting a person's history across records."],
      ["Habits that keep it healthy","Automatically handle hard bounces, deduplicate regularly, make key fields required on forms, give each dataset an owner and review a simple data quality dashboard monthly. Small, regular fixes beat a painful annual clean-up."]],
    deeper:["Bounces hurt deliverability for everyone.","Assign clear data owners.","Monthly checks beat yearly clean-ups."] },
  { id:"workflow", t:"crm", scene:"pipeline", type:"explain", title:"Steal this: the stuck deal nudge",
    body:["If a deal sits in one stage for <strong>14 days</strong>, auto-create a task for its owner.","No more deals quietly dying in the pipeline."],
    article:[["How to build it","Trigger the workflow when a deal has been in the same stage for a set number of days, then create a task assigned to the deal owner with a clear title like 'Deal stuck: check next step'. You can branch on deal amount so bigger deals get a faster nudge."],
      ["Useful variations","Instead of time in stage, trigger on no logged activity for a number of days. Add a second step that alerts the manager if the deal still hasn't moved after the first reminder."],
      ["Measure whether it works","Compare average time in each stage before and after switching it on. The stage that triggers the nudge most often is usually your real bottleneck, which is worth a conversation with the team."]],
    deeper:["Tune the day count per stage.","Escalate to a manager only after a second reminder.","Track which stage fires most often."] },
  { id:"scoring", t:"crm", scene:"pipeline", type:"quiz", q:"Good lead scoring combines two kinds of signal. Which pair?",
    opts:["Price and discount","Fit and engagement","Region and language"], answer:1,
    explain:"Fit is who they are, like company size. Engagement is what they do, like visiting pricing pages.",
    article:[["Fit: who they are","Fit covers attributes like industry, company size, job role and location. It answers whether this person looks like the customers you want."],
      ["Engagement: what they do","Engagement covers behaviour, such as opening and clicking emails, visiting key pages, submitting forms or booking meetings. It answers whether they're interested right now."],
      ["Making it work in practice","Agree the handover threshold with sales, let old engagement points fade over time, and check scores against deals you actually won each quarter. Many CRMs, including HubSpot, let you score fit and engagement separately and combine them."]],
    deeper:["Great fit with no engagement means not ready yet.","High engagement with poor fit can waste sales time.","Scores should decay so old activity stops counting."] },

  { id:"seq", t:"hubspot", scene:"sprocket", type:"explain", title:"Sequences vs workflows: which one when?",
    body:["<strong>Sequences</strong> are personal 1:1 email and task cadences sent from a rep's inbox.","<strong>Workflows</strong> automate at scale in the background, across records and teams."],
    article:[["Sequences","Sequences send a series of emails and create tasks from a rep's own connected inbox, so they feel personal. They stop automatically when the contact replies or books a meeting, which is what makes them good for sales follow-up."],
      ["Workflows","Workflows run in the background based on triggers, such as a form submission or a property change. They update properties, rotate owners, send marketing emails, create tasks and call webhooks, across contacts, companies, deals and tickets."],
      ["Using them together","A common pattern is a workflow that decides who's ready, then enrols them into the right sequence. On some tiers, workflows can do this enrolment directly."]],
    deeper:["Sequences for human-feeling 1:1 follow-up.","Workflows for routing, updates and nurture at scale.","Workflows can feed contacts into sequences on some tiers."] },
  { id:"seqquiz", t:"hubspot", scene:"sprocket", type:"quiz", q:"By default, what happens when a contact replies to a HubSpot sequence email?",
    opts:["They get the next email anyway","They're unenrolled automatically","The sequence restarts"], answer:1,
    explain:"Replies unenrol the contact, so nobody gets an awkward automated follow-up after they've already answered.",
    article:[["What stops a sequence","Replying and booking a meeting both unenrol a contact by default. Reps can also unenrol someone manually, and bounces stop the sequence too."],
      ["Company-level unenrolment","There's a setting to unenrol everyone at the same company when one person replies. It's useful when you're prospecting several people at one business and don't want to double up."],
      ["Getting better results","Keep sequences short, personalise the first line of each email, and mix in call or LinkedIn tasks rather than relying only on email."]],
    deeper:["Replies and meetings unenrol by default.","Company-wide unenrolment is optional.","Short, personal sequences tend to perform best."] },
  { id:"objects", t:"hubspot", scene:"sprocket", type:"explain", title:"Custom objects: when contacts and deals aren't enough",
    body:["On Enterprise, you can create <strong>your own record types</strong> alongside contacts, companies and deals.","Think properties, tenancies or policies, each with its own fields and pipelines."],
    article:[["What they are","Custom objects let you model things in your business that HubSpot doesn't include by default. Each one gets its own properties, records, and can be used in workflows, reports and lists."],
      ["Associations tie it together","Associations link records across objects, like a tenancy to its tenant and guarantor. Association labels describe the relationship, so you can tell a guarantor from a tenant on the same record."],
      ["Plan before you build","Decide which object owns which data, what you need to report on, and how records connect, before you create anything. Restructuring later means migrating data and rebuilding automation."]],
    deeper:["Custom objects need an Enterprise tier.","Association labels describe how records relate.","Sketch the data model first."] },
  { id:"breeze", t:"hubspot", scene:"sprocket", type:"myth", myth:"HubSpot's AI is just a chatbot bolted on the side.",
    reality:"Breeze runs across the platform: a copilot inside records, agents that handle tasks like customer support, and data enrichment on companies and contacts.",
    article:[["The copilot","An assistant that works inside HubSpot, summarising records, drafting emails and answering questions about your data in context."],
      ["Agents","Purpose-built agents take on specific jobs, such as answering customer chats from your knowledge base or helping with prospecting and content. They work best when the knowledge they draw on is clean and current."],
      ["Enrichment and credits","Breeze can fill in company and contact details automatically. Many AI features use credits, and what's included varies by plan, so check before building a process around them."]],
    deeper:["Copilot, agents and enrichment are separate pieces.","Agent quality depends on your knowledge base.","Credit limits vary by plan."] },

  { id:"hormuz", t:"world", scene:"strait", type:"explain", title:"Why one narrow strait moves oil prices worldwide",
    body:["About <strong>a fifth of the world's oil</strong> passes through the Strait of Hormuz.","Tension there shows up in petrol prices far away, including the UK."],
    article:[["Where it is","The strait links the Persian Gulf to the Gulf of Oman, with Iran on one side and Oman and the UAE on the other. Tankers from Saudi Arabia, Iraq, Kuwait, Qatar and the UAE all pass through it."],
      ["Why prices jump on tension","Oil markets price in risk. Even the threat of disruption raises shipping insurance and freight costs, and traders buy ahead of possible shortages, pushing prices up worldwide."],
      ["Are there alternatives?","Saudi Arabia and the UAE have pipelines that bypass the strait, but they can only carry a fraction of the normal flow. That's why it remains one of the world's most important chokepoints."]],
    deeper:["About 33km wide at its narrowest.","Risk alone can move prices.","Bypass pipelines cover only part of the flow."] },
  { id:"today", t:"world", scene:"globe", type:"explain", sample:true, title:"Today's biggest story lives here",
    body:["In the real app this pulls the top story from the last 24 hours, with its news photo.","<strong>Three short lines:</strong> what happened, why it matters, what to watch."],
    article:[["What goes here","The live version shows the biggest story from the last 24 hours with the news photo, then this article view explains it properly."],
      ["How it gets made","Stories are pulled from trusted feeds, the same story is grouped across outlets, and Claude writes a clear summary with the background you need to follow it."],
      ["Staying trustworthy","Every article links to its original sources and shows how many outlets covered it, so you can check anything that surprises you."]],
    deeper:["Live news replaces this sample.","Summaries are grouped across outlets.","Sources are always linked."] },

  { id:"venus", t:"space", scene:"planet", type:"fact", big:"243 > 225", title:"A day on Venus is longer than its year", body:["A day on Venus lasts <strong>243 Earth days</strong>. Its year lasts 225.","Your birthday would come round before one full day ends."],
    article:[["A slow, backwards spin","Venus rotates incredibly slowly and in the opposite direction to most planets, so the sun would rise in the west. Scientists still debate why; giant ancient impacts and the pull of its thick atmosphere are leading ideas."],
      ["A hellish surface","Its thick carbon dioxide atmosphere traps heat, making the surface around 465°C, hotter than Mercury. Surface pressure is about 90 times Earth's, similar to being deep underwater."],
      ["Going back","NASA and ESA have missions planned to study Venus again, aiming to understand how a planet so similar in size to Earth ended up so different."]],
    deeper:["The sun rises in the west on Venus.","Hotter than Mercury despite being further out.","New missions are planned."] },
  { id:"sunlight", t:"space", scene:"sun", type:"explain", title:"The sunlight on your face is 8 minutes old",
    body:["Light takes about <strong>8 minutes 20 seconds</strong> to reach Earth from the sun.","If the sun vanished, you wouldn't know for over 8 minutes."],
    article:[["The maths","The sun is about 150 million km away and light travels at roughly 300,000 km per second. Divide one by the other and you get just over 8 minutes."],
      ["Even older than that","The energy in that light was produced in the sun's core, and it takes a very long time, estimated at many thousands of years, to work its way out to the surface before its final 8-minute trip."],
      ["Looking back in time","The further away something is, the older its light. The Andromeda galaxy's light has travelled about 2.5 million years, so we see it as it was long before humans existed."]],
    deeper:["150 million km at 300,000 km per second.","Energy takes ages to escape the sun's core.","Distant galaxies show us the past."] },

  { id:"legs", t:"future", scene:"robot", type:"explain", title:"Why build robots with legs when wheels are easier?",
    body:["Because the world is <strong>built for human bodies</strong>: stairs, doors, shelves.","A humanoid can slot into existing spaces without rebuilding them."],
    article:[["Designed for our world","Buildings, tools and vehicles are all shaped around human bodies. A robot with a human shape could in theory use them as they are, rather than a business redesigning everything around a machine."],
      ["The hard parts","Balance, battery life and cost are big challenges, but hands are the hardest. Picking up soft, slippery or oddly shaped objects reliably is still difficult."],
      ["Where they are now","Humanoids are mostly in pilot projects in warehouses and car factories, doing repetitive tasks. Wheeled and fixed robots still do most real industrial work because they're cheaper and more efficient."]],
    deeper:["Human-shaped spaces favour human-shaped robots.","Dexterous hands are the toughest problem.","Mostly pilots so far."] },
  { id:"battery", t:"future", scene:"battery", type:"quiz", q:"What's the main promise of solid-state batteries?",
    opts:["More energy and lower fire risk","Cheaper to make today","They never need charging"], answer:0,
    explain:"They swap the flammable liquid inside today's batteries for a solid: longer EV range, safer phones.",
    article:[["How today's batteries work","In a lithium-ion battery, lithium ions move through a liquid electrolyte between two electrodes as it charges and discharges. That liquid is flammable, which is why damaged batteries can catch fire."],
      ["What solid-state changes","Replacing the liquid with a solid material could make batteries safer and allow designs that store much more energy in the same space, meaning longer EV range and faster charging."],
      ["Why they're not everywhere yet","Tiny cracks and metal growths can form inside during charging, and making them reliably at scale is hard and expensive. Several carmakers are racing to crack it."]],
    deeper:["Liquid electrolyte is the fire risk today.","Solid electrolytes could mean more range.","Manufacturing at scale is the barrier."] },

  { id:"marathon", t:"culture", scene:"road", type:"fact", big:"26.2", title:"Why a marathon is 26.2 miles", body:["A marathon is 26.2 miles because of the <strong>1908 London Olympics</strong>.","The route ran from Windsor Castle to the royal box."],
    article:[["The 1908 route","Organisers set the course to start at Windsor Castle and finish in front of the royal box in the White City stadium, giving 26 miles 385 yards."],
      ["A dramatic finish","Italian runner Dorando Pietri collapsed several times near the end and was helped over the line by officials. He was disqualified, but became famous anyway."],
      ["Making it official","Earlier marathons were around 25 miles with no fixed length. The 1908 distance was made the standard in 1921. The name comes from the legend of a Greek messenger running from Marathon to Athens."]],
    deeper:["26 miles 385 yards.","Standardised in 1921.","Named after a Greek legend."] },
  { id:"octopus", t:"culture", scene:"sea", type:"fact", big:"3 hearts", title:"The octopus has three hearts", body:["An octopus has <strong>three hearts and blue blood</strong>.","Two pump blood to the gills, one to the rest of the body."],
    article:[["Three hearts","Two small hearts push blood through the gills to pick up oxygen, and a main heart pumps it around the body. The main heart pauses when they swim, one reason they tend to crawl."],
      ["Blue blood","Octopus blood uses a copper-based molecule to carry oxygen instead of iron, which turns it blue. It works well in cold, low-oxygen water."],
      ["Brains in their arms","Around two-thirds of an octopus's neurons are in its arms, which can react to touch and taste with a lot of independence from the central brain."]],
    deeper:["Main heart pauses when swimming.","Copper makes the blood blue.","Most neurons are in the arms."] },

  { id:"leap", t:"general", scene:"spark", type:"explain", title:"Why leap years exist (and why 2100 won't be one)",
    body:["Earth takes about <strong>365.24 days</strong> to go round the sun, not 365.","Adding a day every four years keeps the calendar lined up with the seasons."],
    article:[["The leftover quarter day","A year of 365 days is about six hours short. Without correction, the calendar would drift by roughly a day every four years, and after a few centuries summer would land in the wrong months."],
      ["The extra rule most people don't know","Adding a day every four years slightly overcorrects. So century years are skipped unless they divide by 400. That's why 2000 was a leap year but 1900 wasn't, and 2100 won't be."],
      ["Where the rules came from","This system is the Gregorian calendar, introduced in 1582. Britain switched in 1752 and had to skip 11 days to catch up."]],
    deeper:["A year is about 365.24 days.","Centuries only count if divisible by 400.","Britain skipped 11 days in 1752."] },
  { id:"banana", t:"general", scene:"spark", type:"fact", big:"Berries", title:"Bananas are berries, strawberries aren't",
    body:["Botanically, <strong>bananas are berries</strong> and strawberries aren't.","A true berry grows from a single flower's ovary with seeds inside."],
    article:[["What counts as a berry","To a botanist, a berry is a fleshy fruit that develops from a single ovary and usually holds several seeds inside. Grapes, tomatoes and bananas all qualify."],
      ["Why strawberries don't","A strawberry grows from the swollen base of the flower, and the little 'seeds' on the outside are actually the fruits. That makes it an accessory fruit rather than a berry."],
      ["Kitchen versus botany","Cooks and botanists just use different definitions. Neither is wrong; they're answering different questions."]],
    deeper:["Tomatoes and grapes are berries too.","Strawberry 'seeds' are the real fruits.","Culinary and botanical names differ."] },
  { id:"lang", t:"general", scene:"spark", type:"quiz", q:"Which language has the most native speakers?",
    opts:["English","Mandarin Chinese","Spanish"], answer:1,
    explain:"Mandarin has the most native speakers. English wins on total speakers once you include people who learned it as a second language.",
    article:[["Native versus total","Mandarin Chinese has the most people who grew up speaking it. English has more total speakers, because so many people learn it as a second language for work, travel and the internet."],
      ["Spanish is a strong second","Spanish is usually ranked second for native speakers, spread across Spain and most of Latin America."],
      ["Why counts vary","Estimates differ because countries measure languages differently and the line between a language and a dialect isn't always clear."]],
    deeper:["Mandarin leads on native speakers.","English leads on total speakers.","Estimates vary by source."] }
];

CARDS.push({ id:"bsl-act", t:"sign", scene:"sign", type:"fact", big:"2022", title:"BSL became a legally recognised language in 2022",
    body:["The <strong>British Sign Language Act 2022</strong> recognised BSL as a language of Great Britain.","It also requires the government to report on how it uses BSL."],
    article:[["What the Act did","It formally recognised British Sign Language in England, Wales and Scotland, and created a BSL Advisory Board to guide how government departments communicate with Deaf people."],
      ["Why it mattered","Campaigners had pushed for decades. The UK government first recognised BSL as a language back in 2003, but that wasn't legal recognition. Scotland passed its own BSL Act in 2015."],

/* ---------- State ---------- */
const load = (k, d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const save = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
let liked = new Set(load('kf-liked', []));
let later = load('kf-later', []);               // ordered list of card ids to read later
let weights = load('kf-weights', {});
let declined = new Set(load('kf-declined', []));
let accepted = new Set(load('kf-accepted', []));
let profile = load('kf-profile3', null);
let followed = load('kf-follow', []);
let work = load('kf-work', []);   // [{id, done:[bool]}]
let quiz = { right:0, done:0 };
const w = t => 1 + (weights[t] || 0);
const allCards = () => [...CARDS, ...localCards(), ...sportCards(), ...langCards(), ...DISCOVER.flatMap(d => d.pool)];
const byId = id => allCards().find(c => c.id === id);

/* Fresh feed on every open: read-later first, then weighted by likes and setup answers */
const plain = s => String(s||'').replace(/<[^>]+>/g,'');
const cardTitle = c => c.title || c.q || c.myth || '';
function updateCard(c){
  return { id:`upd-${c.id}`, origId:c.id, t:c.t, tag:c.tag, scene:c.scene, type:'explain', isUpdate:true, sample:true, title:`Update: ${plain(cardTitle(c)).replace(/^Update: /,'')}`,
    body:["You're following this story. <strong>Here's what's changed</strong> since you last looked.","In the live app, this card only appears when there's genuinely something new."],
    article:[["What's new","In the live version, this section shows only the developments since you last read the story, so you're never re-reading what you already know."],
      ["The timeline","A short timeline of the story so far, with today's change highlighted, so you can catch up in seconds."],
      ["Had enough?","Tap Following below to stop following, and these updates stop."]],
    deeper:["Updates only when something changes.","A timeline to catch up fast.","Unfollow any time."] };
}
function liveCards(){
  const out = []; const teams = profile?.teams || [], sp = profile?.sports || [];
  if(teams.length) out.push({ id:`live-${slug(teams[0])}`, t:'sport', tag:'Matchday', scene:'pitch', type:'live', live:'football', home:teams[0], away:'Rivals FC', sample:true,
    article:[["Matchday mode","When one of your teams is playing, a live card pins itself to the top of your feed with the score, the clock and key moments as they happen."],
      ["After the whistle","The live card turns into a match report: the result, the big moments, and what it means for the table."],
      ["Races and more","It works for races too, like F1 with live positions and laps, plus any other sport you follow."]],
    deeper:["Pins to the top when your team plays.","Becomes a match report at full time.","Works for races too."] });
  if(sp.includes('Formula 1')) out.push({ id:'live-f1', t:'sport', tag:'Race day', scene:'road', type:'live', live:'race', sample:true,
    article:[["Race day mode","During a race, you get the live running order, the lap count, pit stops and incidents, right at the top of your feed."],
      ["Why it's useful","You can follow the race in seconds without a stream, then swipe back to learning."],
      ["After the race","It becomes a race report with the result and what it means for the championship."]],
    deeper:["Live positions and laps.","Pit stops and incidents.","A race report afterwards."] });
  return out;
}
function buildOrder(){
  const saved = later.map(byId).filter(Boolean).map(c => ({...c, isLater:true}));
  let pool = [...CARDS, ...localCards(), ...sportCards()];
  const langNow = langCards();
  DISCOVER.forEach(d => { if(accepted.has(d.t)) pool.push(...d.pool); });
  pool = pool.filter(c => !declined.has(c.t) && !later.includes(c.id));
  pool.forEach(c => c._k = Math.pow(Math.random(), 1 / (w(c.t) + (liked.has(c.id) ? -0.5 : 0))));
  pool.sort((a,b) => b._k - a._k);
  const out = [];
  while(pool.length){ let i = pool.findIndex(c => !out.length || c.t !== out[out.length-1].t); if(i < 0) i = 0; out.push(pool.splice(i,1)[0]); }
  DISCOVER.filter(d => !accepted.has(d.t) && !declined.has(d.t)).forEach((d, k) => out.splice(Math.min(out.length, 5 + k*7), 0, d));
  const updates = followed.map(byId).filter(Boolean).map(updateCard);
  return [{ id:"intro", type:"intro", n:saved.length }, ...liveCards(), ...langNow.filter(c=>!later.includes(c.id)), ...updates, ...saved, ...out, { id:"end", type:"end" }];
}

function setLangs(list){ profile = {...(profile||{}), langs:list}; weights.lang = list.some(l=>LANGS[l]) ? 3 : 0; if(list.includes('British Sign Language')) weights.sign = Math.max(weights.sign||0, 3); save('kf-profile3', profile); save('kf-weights', weights); }
const liveState = {};
function liveHTML(c){
  const s = liveState[c.id] ||= (c.live==='race' ? { lap:31, total:57, order:['Driver A','Driver B','Driver C'], ev:'Driver B is closing in on the leader' } : { min:34, h:1, a:0, ev:`Goal! ${c.home} lead` });
  if(c.live==='race') return `<div class="live" data-live="${c.id}"><div class="clock"><i></i>LIVE <span class="t">Lap ${s.lap}/${s.total}</span></div><h2>Race day</h2><ol class="order">${s.order.map(d=>`<li>${d}</li>`).join('')}</ol><p class="event">${s.ev}</p></div>`;
  return `<div class="live" data-live="${c.id}"><div class="clock"><i></i>LIVE <span class="t">${s.min}'</span></div><div class="score"><span>${c.home}</span><b class="sc">${s.h} – ${s.a}</b><span>${c.away}</span></div><p class="event">${s.ev}</p></div>`;
}
/* Simulated ticking for the sample live cards */
setInterval(()=>{
  document.querySelectorAll('[data-live]').forEach(node=>{
    const id = node.dataset.live, s = liveState[id]; if(!s) return; const c = node.closest('.card')?._card; if(!c) return;
    if(c.live==='race'){ if(s.lap >= s.total){ s.ev = 'Chequered flag. Race report coming up.'; }
      else { s.lap++; if(Math.random() < .25){ const i = Math.random() < .5 ? 1 : 2; [s.order[i-1], s.order[i]] = [s.order[i], s.order[i-1]]; s.ev = `${s.order[i-1]} moves up to P${i}`; } else if(Math.random() < .15) s.ev = `${s.order[2]} pits for fresh tyres`; }
      node.querySelector('.t').textContent = `Lap ${s.lap}/${s.total}`; node.querySelector('.order').innerHTML = s.order.map(d=>`<li>${d}</li>`).join('');
    } else { if(s.min >= 90){ s.ev = `Full time. ${s.h > s.a ? c.home + ' win' : s.h < s.a ? c.away + ' win' : 'Honours even'}.`; node.querySelector('.t').textContent = 'FT'; }
      else { s.min++; if(Math.random() < .07){ if(Math.random() < .55){ s.h++; s.ev = `Goal! ${c.home} score (${s.min}')`; } else { s.a++; s.ev = `${c.away} pull one back (${s.min}')`; } } else if(Math.random() < .08) s.ev = `Yellow card, ${Math.random()<.5?c.home:c.away} (${s.min}')`;
        node.querySelector('.t').textContent = `${s.min}'`; }
      node.querySelector('.sc').textContent = `${s.h} – ${s.a}`; }
    node.querySelector('.event').textContent = s.ev;
  });
}, 3000);

const label = c => c.t==='local' && profile?.place ? `Local: ${profile.place}` : ((c.t==='sport' || c.t==='lang' || c.t==='sign') && c.tag ? c.tag : TOPICS[c.t]);

};

function actionsHTML(c){
  return `<div class="actions">
    <button class="act like ${liked.has(c.id)?'on':''}" aria-label="Like" aria-pressed="${liked.has(c.id)}">${ICON.heart}</button><span class="act-label">Like</span>

    <button class="act deep" aria-label="Read more">${ICON.book}</button><span class="act-label">Read more</span></div>`;

function render(c){
  const el = document.createElement('section');
  el.dataset.id = c.id;
  if(c.type==='intro' || c.type==='end'){
    el.className = 'card plain';
    const top = Object.entries(weights).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>0).slice(0,2).map(e=>TOPICS[e[0]]);
    const hi = profile?.name ? `Fresh feed for you, ${profile.name}.` : 'Fresh feed, built just now.';
    el.innerHTML = c.type==='intro'
      ? `<div class="inner"><h2>${c.n ? `${c.n} saved for you, up first.` : hi}</h2>
         ${c.n ? `<p>You marked ${c.n===1?'this':'these'} to read later. Tap <strong>Read more</strong> to open the full article; it's cleared from your list once read.</p>` : '<p>Double tap or hit the heart on anything interesting. Tap <strong>Read more</strong> for the full article.</p>'}
         ${top.length?`<p>Leaning towards <strong>${top.join(' and ')}</strong>.</p>`:''}
         ${work.length ? `<button class="cta ghost worklist-btn">Your work list (${work.length})</button>` : ''}
         <div class="hint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Swipe up to start</div></div>`
      : `<div class="inner"><h2>You're all caught up.</h2><div class="stats"><div><b id="endLiked">0</b><span>liked</span></div><div><b id="endLater">0</b><span>read later</span></div><div><b id="endQuiz">0/0</b><span>quiz</span></div></div><p>Reopen for a fresh feed. Anything you marked for later will be waiting at the top.</p><div class="choices"><button class="cta" id="rebuild">Refresh my feed</button><button class="cta ghost" id="redo">Change my feed</button>${work.length?`<button class="cta ghost worklist-btn">Work list (${work.length})</button>`:''}</div></div>`;
    el.querySelector('#rebuild')?.addEventListener('click', ()=>{ build(); feed.scrollTo({top:0}); });
    el.querySelector('#redo')?.addEventListener('click', ()=>openChat());
    el.querySelector('.worklist-btn')?.addEventListener('click', openWorkList);
    return el;
  }
  el.className = `card t-${c.t}`;
  let html = (c.type==='signday' ? signSVG() : scene(c.scene, seedFor(c.id))) + '<div class="shade"></div><div class="inner">';
  html += `<span class="topic">${label(c)}</span>${c.type==='live'?'<span class="tag live-tag">Sample live</span>':''}${c.isUpdate?'<span class="tag">Following</span>':''}${c.isLater?'<span class="tag">Read later</span>':''}${c.sample&&c.type!=='live'?'<span class="tag">Sample slot</span>':''}${c.type==='discover'?'<span class="tag">Suggested</span>':''}${c.type==='try'?'<span class="tag">Try at work</span>':''}`;
  if(c.reason) html += `<p class="why">${c.reason}</p>`;
  if(c.type==='explain') html += `<h2>${c.title}</h2>${c.body.map(b=>`<p>${b}</p>`).join('')}`;
  if(c.type==='fact') html += `<div class="big">${c.big}</div>${c.body.map(b=>`<p>${b}</p>`).join('')}`;
  if(c.type==='quiz') html += `<h2>${c.q}</h2><div class="opts">${c.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><p class="explain">${c.explain}</p>`;
  if(c.type==='myth') html += `<p class="myth-label">Myth</p><h2>${c.myth}</h2><button class="reveal">Show the reality</button><div class="reality"><p class="myth-label">Reality</p><p>${c.reality}</p></div>`;
  if(c.type==='phrase') html += `<p class="myth-label">Phrase of the day</p><h2 class="phrase">${c.phrase}</h2><p class="say">Say it: <strong>${c.say}</strong></p><p><strong>${c.mean}</strong>. ${c.when}</p><div class="choices"><button class="choice yes hear">Hear it</button><button class="choice slow">Slowly</button></div>`;
  if(c.type==='signday') html += `<p class="myth-label">Sign of the day</p><h2>The BSL vowels</h2><p>Thumb is <strong>A</strong>, then <strong>E, I, O, U</strong> across the fingertips. Watch the finger move.</p>`;
  if(c.type==='langoffer') html += `<p class="myth-label">New</p><h2>Learn a language while you scroll?</h2><p>A phrase of the day, with how to say it and when to use it. Pick any you like.</p><div class="lang-chips">${LANG_OPTS.map(L=>`<button class="po lc" aria-pressed="false" data-l="${L}"><span>${L}</span><span class="tick"></span></button>`).join('')}</div><div class="choices"><button class="choice yes lang-go">Add to my feed</button><button class="choice no lang-no">Not right now</button></div>`;
  if(c.type==='try') html += `<h2>${c.title}</h2>${c.body.map(b=>`<p>${b}</p>`).join('')}<p class="hint-line">Tap Read more for the steps.</p>`;
  if(c.type==='live') html += liveHTML(c);
  if(c.type==='discover') html += `<h2>${c.title}</h2>${c.body.map(b=>`<p>${b}</p>`).join('')}<div class="choices"><button class="choice yes">Add to my feed</button><button class="choice no">Not for me</button></div>`;
  html += '</div>';
  if(c.type!=='discover' && c.type!=='langoffer') html += actionsHTML(c);
  el.innerHTML = html;

  el._card = c;
  el.querySelector('.hear')?.addEventListener('click', ()=>speakIn(c.phrase, c.lang, .9));
  el.querySelector('.slow')?.addEventListener('click', ()=>speakIn(c.phrase, c.lang, .55));
  el.querySelectorAll('.lc').forEach(b=>b.addEventListener('click', ()=>b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true' ? 'false' : 'true')));
  el.querySelector('.lang-go')?.addEventListener('click', ()=>{
    const picked = [...el.querySelectorAll('.lc[aria-pressed=true]')].map(b=>b.dataset.l); if(!picked.length){ toast('Pick at least one, or tap Not right now'); return; }
    setLangs(picked); let after = el; langCards().forEach(n=>{ const node = render(n); after.after(node); observe(node); after = node; });
    el.querySelector('.inner').innerHTML = `<h2>Added ${picked.join(', ')}.</h2><p>Swipe up for your first one. You'll get a new one every day.</p>`; toast('Languages added');
  });
  el.querySelector('.lang-no')?.addEventListener('click', ()=>{ setLangs([]); el.querySelector('.inner').innerHTML = '<h2>No problem.</h2><p>You can add a language any time from the chat.</p>'; });
  el.querySelector('.like')?.addEventListener('click', ()=> toggleLike(c));
  el.querySelector('.later')?.addEventListener('click', ()=> toggleLater(c));
  el.querySelector('.deep')?.addEventListener('click', ()=> openArticle(c));
  el.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
    if(el.dataset.answered) return; el.dataset.answered = 1;
    const k = +o.dataset.k; quiz.done++; if(k===c.answer) quiz.right++;
    el.querySelectorAll('.opt').forEach(x=>{ const xk=+x.dataset.k; if(xk===c.answer) x.classList.add('right'); else if(xk===k) x.classList.add('wrong'); });
    el.querySelector('.explain').classList.add('show'); counts();
  }));
  el.querySelector('.reveal')?.addEventListener('click', e=>{ e.currentTarget.remove(); el.querySelector('.reality').classList.add('show'); });
  if(c.type==='discover') el.querySelector('.choice.yes')?.addEventListener('click', ()=>{
    accepted.add(c.t); weights[c.t] = (weights[c.t]||0) + 1; save('kf-accepted',[...accepted]); save('kf-weights',weights);
    let after = el; c.pool.forEach(p=>{ const n = render({...p, reason:`Because you added ${TOPICS[c.t].toLowerCase()}`}); after.after(n); observe(n); after = n; });
    el.querySelector('.choices').innerHTML = '<p><strong>Added.</strong> Swipe up for your first ones.</p>';
    toast(`${TOPICS[c.t]} added to your feed`);
  });
  if(c.type==='discover') el.querySelector('.choice.no')?.addEventListener('click', ()=>{
    declined.add(c.t); save('kf-declined',[...declined]);
    el.querySelector('.choices').innerHTML = `<p><strong>Got it.</strong> No more ${TOPICS[c.t].toLowerCase()}.</p>`;
    toast('Noted, keep swiping');
  });

  let last = 0;
  el.addEventListener('pointerup', e=>{
    if(e.target.closest('button') || c.type==='discover') return;
    const now = Date.now();
    if(now - last < 300){ const b = el.getBoundingClientRect(); burst(el, e.clientX - b.left, e.clientY - b.top); if(!liked.has(c.id)) toggleLike(c); last = 0; }
    else last = now;
  });
  return el;
}

function burst(el, x, y){
  const h = document.createElement('div'); h.className='burst'; h.style.left=x+'px'; h.style.top=y+'px';
  h.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.5S3.5 15.6 3.5 9.3A4.6 4.6 0 0 1 12 6.8a4.6 4.6 0 0 1 8.5 2.5c0 6.3-8.5 11.2-8.5 11.2z"/></svg>';
  el.appendChild(h); setTimeout(()=>h.remove(), 850);
}

/* Keep every copy of a button (card + open article) in sync */
function syncButtons(c){
  document.querySelectorAll(`[data-id="${c.id}"] .like, #article[data-for="${c.id}"] .like`).forEach(b=>{ b.classList.toggle('on', liked.has(c.id)); b.setAttribute('aria-pressed', liked.has(c.id)); });
  document.querySelectorAll(`[data-id="${c.id}"] .later, #article[data-for="${c.id}"] .later`).forEach(b=>{ b.classList.toggle('on', later.includes(c.id)); b.setAttribute('aria-pressed', later.includes(c.id)); const l=b.querySelector('.lbl'); if(l) l.textContent = later.includes(c.id)?'Saved for later':'Read later'; });
}

function toggleLike(c){
  const on = !liked.has(c.id);
  on ? liked.add(c.id) : liked.delete(c.id);
  weights[c.t] = Math.max(0, (weights[c.t]||0) + (on ? 1 : -1));
  save('kf-liked',[...liked]); save('kf-weights',weights); syncButtons(c);
  document.querySelectorAll(`[data-id="${c.id}"] .like`).forEach(b=>{ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
  if(on){
    const el = feed.querySelector(`[data-id="${c.id}"]`); const cards = [...feed.children]; const here = cards.indexOf(el);
    const next = here >= 0 && cards.slice(here + 2).find(n => n.classList.contains('t-'+c.t) && !n.dataset.seen);
    if(next){ el.after(next); toast(`More ${TOPICS[c.t].toLowerCase()} coming up`); }
    else toast(`Liked. More ${TOPICS[c.t].toLowerCase()} next time`);
  }
  counts();
}

function toggleLater(c){
  if(later.includes(c.id)){ later = later.filter(x=>x!==c.id); toast('Removed from read later'); }
  else { later.push(c.id); toast("Saved. It'll be first next time you open"); }
  save('kf-later', later); syncButtons(c); counts();
}

function counts(){
  document.getElementById('likePill').textContent = later.length ? `${later.length} to read` : `${liked.size} liked`;
  const set = (id, v) => { const n = document.getElementById(id); if(n) n.textContent = v; };
  set('endLiked', liked.size); set('endLater', later.length); set('endQuiz', `${quiz.right}/${quiz.done}`);
}

let tt; function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('show'), 2000); }

let currentEl = null;
const prog = document.getElementById('prog'), topBar = document.getElementById('top');
const io = new IntersectionObserver(entries=>{
  entries.forEach(en=>{ if(en.isIntersecting && en.intersectionRatio > .6){
    en.target.dataset.seen = 1; currentEl = en.target;
    const cards = [...feed.children]; const i = cards.indexOf(en.target);
    prog.style.width = `${(i/(cards.length-1))*100}%`;
    topBar.classList.toggle('light', en.target.classList.contains('plain'));
  }});
},{ root:feed, threshold:[.6] });
const observe = n => io.observe(n);
function build(){ feed.innerHTML=''; quiz = {right:0, done:0}; buildOrder().forEach(c=>{ const n = render(c); feed.appendChild(n); observe(n); }); counts(); }

/* ---------- Full article view ---------- */
const art = document.getElementById('article');
const NEWSY = c => ['world','local','sport'].includes(c.t) || c.sample || c.isUpdate;
function sourceHTML(c){
  const [names, conf] = SRC[c.origId || c.id] || [[`${TOPICS[c.t]} coverage from trusted outlets`], c.sample ? 'Sample' : 'Well established'];
  const coverage = NEWSY(c) ? `<p class="src-note">In the live app: how many outlets covered this, and whether coverage leans one way.</p>
      <div class="lean" aria-label="Sample coverage balance"><span style="flex:3" class="l">Left</span><span style="flex:5" class="c">Centre</span><span style="flex:2" class="r">Right</span></div>
      <p class="src-note">Sample: covered by 14 outlets, mostly balanced.</p>` : '';
  return `<div class="src"><h3>Source check</h3><p><strong>Based on:</strong> ${names.join(', ')}</p><p><span class="conf">${conf}</span></p>${coverage}</div>`;
}
function openArticle(c){
  stopAudio();
  if(c.type==='signday'){ /* hero shows the animation */ }
  const title = plain(cardTitle(c)) || (c.live==='race' ? 'Race day mode' : c.live ? 'Matchday mode' : '');
  const words = c.article.reduce((n,[h,p]) => n + p.split(' ').length, 0);
  const followId = c.origId || c.id; const isFollowing = followed.includes(followId);
  const inWork = work.find(x=>x.id===c.id);
  art.dataset.for = c.id;
  art.className = `article t-${c.t}`;
  art.innerHTML = `
    <div class="a-hero">${c.type==='signday' ? signSVG() : scene(c.scene, seedFor(c.id))}<div class="shade"></div>
      <button class="a-back" aria-label="Back to feed"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="a-grab" aria-hidden="true"></div>
      <div class="a-head"><span class="topic">${label(c)}</span><h1>${title}</h1><span class="a-meta">${Math.max(1, Math.round(words/200))} min read</span></div></div>
    <div class="a-tools">
      <button class="tool listen">Listen</button>
      ${NEWSY(c) && c.type!=='live' ? `<button class="tool follow ${isFollowing?'on':''}">${isFollowing?'Following':'Follow story'}</button>` : ''}
    </div>
    <div class="a-body">
      <div class="orig">
      ${c.type==='quiz' ? `<p class="a-lede">The answer: <strong>${c.opts[c.answer]}</strong>. ${c.explain}</p>` : ''}
      ${c.type==='myth' ? `<p class="a-lede"><strong>Reality:</strong> ${c.reality}</p>` : ''}
      ${c.body ? `<p class="a-lede">${c.body.join(' ')}</p>` : ''}
      ${c.type==='try' ? `<div class="steps"><h3>Your 3 steps</h3>${c.steps.map((s,i)=>`<label class="step"><input type="checkbox" data-i="${i}" ${inWork?.done?.[i]?'checked':''}><span>${s}</span></label>`).join('')}<button class="cta add-work">${inWork?'On your work list':'Add to my work list'}</button></div>` : ''}
      ${c.type==='phrase' ? `<p class="src-note">This week's phrase pack. Tap a phrase to hear it.</p>` : ''}
      ${c.article.map(([h,p]) => c.type==='phrase' ? `<h3><button class="hear-p" data-p="${h.replace(/"/g,'&quot;')}">${h}</button></h3><p>${p}</p>` : `<h3>${h}</h3><p>${p}</p>`).join('')}
      </div>
      <div class="takeaways"><h3>Key takeaways</h3><ul>${c.deeper.map(d=>`<li>${d}</li>`).join('')}</ul></div>
      ${sourceHTML(c)}
    </div>
    <div class="a-bar">
      <button class="a-btn like ${liked.has(c.id)?'on':''}" aria-pressed="${liked.has(c.id)}">${ICON.heart}<span>Like</span></button>
      <button class="a-btn later ${later.includes(c.id)?'on':''}" aria-pressed="${later.includes(c.id)}">${ICON.clock}<span class="lbl">${later.includes(c.id)?'Saved for later':'Read later'}</span></button>
    </div>`;
  art.querySelector('.a-back').addEventListener('click', closeArticle);
  art.querySelectorAll('.hear-p').forEach(b=>b.addEventListener('click', ()=>speakIn(b.dataset.p, c.lang, .8)));
  art.querySelector('.a-btn.like').addEventListener('click', ()=>toggleLike(c));
  art.querySelector('.a-btn.later').addEventListener('click', ()=>toggleLater(c));
  art.querySelector('.tool.listen').addEventListener('click', ()=>{ const parts = [title, ...(c.body||[]).map(plain), ...c.article.map(([h,p])=>`${h}. ${p}`)]; playQueue(parts.map(t=>({ text:t, label:title }))); });
  art.querySelector('.tool.follow')?.addEventListener('click', e=>{
    const b = e.currentTarget; const on = !followed.includes(followId);
    followed = on ? [...followed, followId] : followed.filter(x=>x!==followId); save('kf-follow', followed);
    b.classList.toggle('on', on); b.textContent = on ? 'Following' : 'Follow story';
    toast(on ? "Following. Updates will appear at the top of your feed" : 'Stopped following');
  });
  art.querySelectorAll('.step input').forEach(cb=>cb.addEventListener('change', ()=>{
    let item = work.find(x=>x.id===c.id); if(!item){ item = { id:c.id, done:[false,false,false] }; work.push(item); art.querySelector('.add-work').textContent = 'On your work list'; }
    item.done[+cb.dataset.i] = cb.checked; save('kf-work', work);
    if(item.done.every(Boolean)) toast('All 3 done. Nice work');
  }));
  art.querySelector('.add-work')?.addEventListener('click', e=>{
    if(work.find(x=>x.id===c.id)){ openWorkList(); return; }
    work.push({ id:c.id, done:[false,false,false] }); save('kf-work', work); e.currentTarget.textContent = 'On your work list'; toast('Added to your work list');
  });
  art.scrollTop = 0;
  requestAnimationFrame(()=> art.classList.add('open'));
  art.querySelector('.a-back').focus({preventScroll:true});
  if(later.includes(c.id)){ later = later.filter(x=>x!==c.id); save('kf-later', later); syncButtons(c); counts(); setTimeout(()=>toast('Marked as read'), 400); }
}

/* Work list */
function openWorkList(){
  stopAudio();
  art.dataset.for = ''; art.className = 'article t-crm';
  const items = work.map(w => ({ w, c: byId(w.id) })).filter(x=>x.c);
  art.innerHTML = `<div class="a-body wl"><button class="a-back static" aria-label="Back to feed"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 class="wl-title">Your work list</h1><p class="src-note">Things to try at work. Tick steps off as you go.</p>
    ${items.length ? items.map(({w,c})=>`<div class="wl-item" data-id="${c.id}"><h3>${c.title.replace('Try this: ','')}</h3>${c.steps.map((s,i)=>`<label class="step"><input type="checkbox" data-i="${i}" ${w.done[i]?'checked':''}><span>${s}</span></label>`).join('')}<button class="tool rm">Remove</button></div>`).join('') : '<p>Nothing here yet. Look out for cards tagged "Try at work".</p>'}
  </div>`;
  art.querySelector('.a-back').addEventListener('click', closeArticle);
  art.querySelectorAll('.wl-item').forEach(node=>{
    const w = work.find(x=>x.id===node.dataset.id);

    node.querySelector('.rm').addEventListener('click', ()=>{ work = work.filter(x=>x!==w); save('kf-work', work); node.remove(); });
  });
